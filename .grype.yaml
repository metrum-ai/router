# Grype ignore rules for this repository. Every entry must carry an owner, a
# reason, and a concrete expiry condition tied to an upstream event, not to a
# closed issue. Re-validated 2026-10-27 during the 2026-W44 scan (Refs #380):
#
# - The braces exception (GHSA-vfj7-8cjw-p6xm) was removed: GitHub withdrew
#   the advisory on 2026-10-23 and current grype databases no longer report
#   it for braces 3.0.3.
# - The stdlib (go1.26.4) and second x/text (GO-2026-6629) exceptions for the
#   TypeScript native compiler binary were removed: with the current grype
#   database none of those IDs match the shipped tsc binary any longer.
#
# Remaining exception: the TypeScript 7 native compiler binary
# (@typescript/typescript-<os>-<arch>/lib/tsc), a build-time-only
# devDependency of internal/router/admindist/web that is never shipped in the
# router binary or image. typescript 7.0.2, the latest stable release
# (checked 2026-10-27), is built with golang.org/x/text v0.38.0, which
# GO-2026-5970 (infinite loop on invalid input) affects. A local type-check
# never parses attacker-controlled input through x/text, so build-time
# exposure is negligible.
# Owner: release/compliance. Expiry: when a stable typescript release ships a
# tsc built with golang.org/x/text >= 0.39.0; revisit on every admin
# dependency refresh (Refs #276).
ignore:
  - vulnerability: GO-2026-5970
    package:
      name: golang.org/x/text
      version: v0.38.0
      type: go-module
      location: "**/node_modules/@typescript/typescript-*/lib/tsc"

# Grype ignore rules for this repository. Every entry must carry an owner, a
# reason, and a concrete expiry condition tied to an upstream event, not to a
# closed issue. Re-validated 2026-11-16 against Grype DB built 2026-11-15 (Refs #276):
#
# - The braces exception (GHSA-vfj7-8cjw-p6xm) was removed: GitHub withdrew
#   the advisory on 2026-10-23 and current grype databases no longer report
#   it for braces 3.0.3.
# - The stdlib (go1.26.4) and second x/text (GO-2026-6629) exceptions for the
#   TypeScript native compiler binary were removed: with the current grype
#   database none of those IDs match the shipped tsc binary any longer.
#
# The TypeScript exception covers the TypeScript 7 native compiler binary
# (@typescript/typescript-<os>-<arch>/lib/tsc), a build-time-only
# devDependency of internal/router/admindist/web that is never shipped in the
# router binary or image. typescript 7.0.2, the latest stable release
# (checked 2026-11-16), is built with go1.26.4 and golang.org/x/text v0.38.0, which
# GO-2026-5970 (infinite loop on invalid input) affects. A local type-check
# never parses attacker-controlled input through x/text, so build-time
# exposure is negligible.
# Owner: release/compliance. Expiry: when a stable typescript release ships a
# tsc built with fixed Go and golang.org/x/text >= 0.41.0; revisit on every admin
# dependency refresh (Refs #276).
ignore:
  - vulnerability: GO-2026-5970
    package:
      name: golang.org/x/text
      version: v0.38.0
      type: go-module
      location: "**/node_modules/@typescript/typescript-*/lib/tsc"

  # Owner: release/compliance.
  # Reason: picomatch is build-time tooling for the docs site and admin UI.
  # It never ships in the router binary or packaged admin bundle. Its extglob
  # patterns come from our own build configuration, not from users.
  # Expiry: when a patched picomatch release exists; bump and remove.
  # Grype attributes node_modules/picomatch to package-lock.json on a clean
  # checkout and to the package manifest when dependencies are installed.
  - vulnerability: GHSA-fc5q-39xc-vjpf
    package:
      name: picomatch
      version: "2.3.2"
      type: npm
      location: "/docs-site/{package-lock.json,node_modules/picomatch/package.json}"
  - vulnerability: GHSA-fc5q-39xc-vjpf
    package:
      name: picomatch
      version: "4.0.7"
      type: npm
      location: "/internal/router/admindist/web/{package-lock.json,node_modules/picomatch/package.json}"

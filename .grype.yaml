# Temporary, advisory-specific exception for the build-tool-only braces
# dependency (docs-site and internal/router/admindist/web), which has no
# patched release. Owner: release/compliance. Expiry: when
# https://github.com/metrum-ai/router/issues/253 is closed or braces publishes
# a fixed release. Reviewed 2026-10-10; revisit on every docs/admin dependency
# refresh.
ignore:
  - vulnerability: GHSA-vfj7-8cjw-p6xm
    package:
      name: braces
      version: 3.0.3
      type: npm

# Temporary, advisory-specific exception for the Go toolchain embedded in the
# TypeScript 7 native compiler binary (@typescript/typescript-<os>-<arch>/lib/tsc),
# a build-time-only devDependency of internal/router/admindist/web that is never
# shipped in the router binary or image. typescript 7.0.2, the latest stable
# release, is built with go1.26.4 and golang.org/x/text v0.38.0; only 7.1 dev
# nightlies use a newer toolchain. Owner: release/compliance. Expiry: when a
# stable typescript release ships a tsc built with go >= 1.26.9 (or >= 1.27.2)
# and golang.org/x/text >= 0.41.0, or when
# https://github.com/metrum-ai/router/issues/253 is closed. Reviewed 2026-10-10;
# revisit on every admin dependency refresh.
# GO-2026-6603..6613 (fixed in go1.26.9/go1.27.2) gained High/Critical grype
# severities on 2026-10-10; no typescript release, stable or nightly (go1.27.1),
# is built with a fixed toolchain yet. They cover net/http, HTTP/2, multipart,
# crypto/tls ECH and Windows os.Root paths that a local type-check never serves.
  - vulnerability: CVE-2026-33818
    package:
      name: stdlib
      version: go1.26.4
      type: go-module
      location: "**/node_modules/@typescript/typescript-*/lib/tsc"
  - vulnerability: CVE-2026-39822
    package:
      name: stdlib
      version: go1.26.4

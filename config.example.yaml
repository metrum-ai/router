models:
  # Catalog-only Learned Routing Policy experiment. Do not activate until exact
  # provider/model/dialect/caller-shape validation and protected evaluation pass.
  # See docs/LEARNED_ROUTING_POLICY.md. Group names here are deployment examples.
  # lrp-demo:
  #   strategy: external
  #   external_policy:
  #     url: http://127.0.0.1:18093/route
  #     allow_hosts: [127.0.0.1]
  #     mode: shadow
  #     timeout_ms: 500
  #     max_response_bytes: 65536
  #     include_request: true
  #     on_error: fail_closed
  #     headers:
  #       X-LRP-Auth: ${LRP_POLICY_AUTH_HEADER}
  #   targets:
  #     - {provider: openrouter, model_ref: gemma-4-26b-a4b-it-nitro, tier: cheap, weight: 1}
  #     - {provider: openrouter, model_ref: deepseek-v4-flash-nitro, tier: cheap, weight: 1}
  #     - {provider: openrouter, model_ref: openrouter-minimax-m3, tier: mid, weight: 1}
  #     - {provider: openrouter, model_ref: qwen3-7-plus-nitro, tier: mid, weight: 1}
  #     - {provider: openrouter, model_ref: openrouter-xai-grok-4-3, tier: strong, weight: 1}
  #     - {provider: openrouter, model_ref: openrouter-claude-sonnet-4-6, tier: anchor, weight: 1}
  # A restricted one-target group per validated candidate supports fanout.
  # lrp-fanout-0:
  #   strategy: static
  #   targets:
  #     - {provider: openrouter, model_ref: gemma-4-26b-a4b-it-nitro, weight: 1}
  # Local-only VLM acceptance groups. Do not grant these groups to production
  # callers or promote a target into a broad group until the exact API skin has
  # passed receipt OCR, forced function-tool, streaming, and cap tests.
  image-analysis-smoke-gpt54:
    strategy: static
    targets:
    - provider: openai
      model_ref: gpt-5.4
      request_shape_support:
        required_input_modalities: [image]
        supported_inbound_dialects: [openai-responses]
        min_requested_output_tokens: 512
  image-analysis-smoke-grok45:
    strategy: static
    targets:
    - provider: xai
      model_ref: grok-4-5
      dialect: openai-responses
      input_modalities: [text, image]
      tool_support:
        openai_responses: [function]
      request_shape_support:
        required_input_modalities: [image]
        supported_inbound_dialects: [openai-responses]
        min_requested_output_tokens: 512
  image-analysis-smoke-claude46:
    strategy: static
    targets:
    - provider: openrouter_responses
      model_ref: openrouter-claude-sonnet-4-6
      request_shape_support:
        required_input_modalities: [image]
        supported_inbound_dialects: [openai-responses]
        min_requested_output_tokens: 512
  # Retained as a local staging canary. Its Responses image contract is not
  # established: passing this group is required before any production weight.
  image-analysis-smoke-minimax-m3:
    strategy: static
    targets:
    - provider: minimax_responses
      model_ref: m3
      input_modalities: [text, image]
      tool_support:
        openai_responses: [function]
      request_shape_support:
        required_input_modalities: [image]
        supported_inbound_dialects: [openai-responses]
        min_requested_output_tokens: 512
  crusoe-smoke:
    strategy: static
    targets:
    - provider: crusoe
      model_ref: llama-3-3-70b-instruct
      # Targets may override catalog request_shape_support when a model group
      # needs stricter request-size, token, or tool-schema limits than the
      # provider catalog default.
      # request_shape_support:
      #   max_estimated_input_tokens: 120000
      #   max_requested_output_tokens: 8192
      # A Chat target may opt into stateless `/v1/responses` bridge eligibility
      # with responses_to_chat. Leave omitted unless that target passed a
      # router-level Responses-to-Chat bridge smoke.
      # responses_to_chat:
      #   enabled: true
      #   text: true
      #   function_tools: true
      #   tool_choice: true
  crusoe-gemma-smoke:
    strategy: static
    targets:
    - provider: crusoe
      model_ref: gemma-4-31b-it
  crusoe-nemotron-omni-smoke:
    strategy: static
    targets:
    - provider: crusoe
      model_ref: nemotron-3-nano-omni-reasoning-30b-a3b
  openai-gpt54-vision-smoke:
    strategy: static
    targets:
    - provider: openai
      model_ref: gpt-5.4
  reasoning-smoke:
    strategy: failover
    targets:
    - provider: fireworks
      model_ref: gpt-oss-20b
    - provider: minimax_responses
      model_ref: m3
    - provider: kimi_anthropic
      model_ref: kimi-k2.7-code
      default_thinking:
        type: enabled
        budget_tokens: 1024
  reasoning-bridge-smoke:
    strategy: failover
    # Dedicated safe group for production-derived agent/reasoning bridge fixtures.
    # Grant one reusable, scoped evaluation caller access in deployment config
    # before staging or production validation. Do not repurpose a broad production
    # coding group for experimental bridge fixture activation.
    targets:
    - provider: minimax_responses
      model_ref: m3
      tool_only: true
      bridges:
        chat_to_responses:
          enabled: true
          tools: true
          tool_choice: true
    - provider: fireworks
      model_ref: gpt-oss-20b
    - provider: kimi_anthropic
      model_ref: kimi-k2.7-code
      tool_only: true
      default_thinking:
        type: enabled
        budget_tokens: 1024
  responses-to-chat-bridge-smoke:
    strategy: static
    # Isolated inverse bridge smoke target so Responses-to-Chat fixtures cannot
    # be satisfied by a native Responses target before exercising the bridge.
    targets:
    - provider: minimax
      model_ref: m3
      responses_to_chat:
        enabled: true
        text: true
        function_tools: true
        tool_choice: true
  temp-coder:
    strategy: weighted
    targets:
    - provider: openai
      model_ref: gpt-5.4-nano
      weight: 70
    - provider: minimax
      model_ref: m3
      weight: 15
    - provider: kimi
      model_ref: kimi-k2.7-code
      weight: 15
    - provider: minimax_anthropic
      model_ref: m3
      weight: 50
      tool_only: true
    - provider: kimi_anthropic
      model_ref: kimi-k2.7-code
      weight: 50
      tool_only: true
      default_thinking:
        type: enabled
        budget_tokens: 1024
  vision:
    strategy: weighted
    targets:
    - provider: xai
      model_ref: grok-4-3
      weight: 77
    - provider: openrouter
      model_ref: openrouter-claude-sonnet-4-6
      weight: 5
    - provider: openai
      model_ref: gpt-5.4
      weight: 30
    - provider: openai
      model_ref: gpt-5.4-nano
      weight: 8
    - provider: minimax
      model_ref: m3
      weight: 5
    - provider: openrouter
      model_ref: openrouter-xai-grok-4-3
      weight: 5
    - provider: openrouter
      model_ref: openrouter-minimax-m3
      weight: 2
    - provider: openrouter_anthropic
      model_ref: openrouter-claude-sonnet-4-6
      weight: 10
    - provider: openrouter_anthropic
      model_ref: openrouter-xai-grok-4-3
      weight: 5
    - provider: openrouter_anthropic
      model_ref: openrouter-minimax-m3
      weight: 3
  adaptive-agent:
    strategy: dynamic_score
    # Estimated target-selection ceilings for semantic/dynamic_score only.
    # This is not a universal hard-dollar ledger or invoice guarantee. Weighted
    # and other strategies ignore spend_ceiling.
    spend_ceiling:
      max_estimated_cost_usd: 0.05
      max_tier: standard
      allowed_tiers: [cheap, standard]
      tier_ceilings:
        cheap: 0.01
        standard: 0.05
    contract:
      display_name: Adaptive agent
      caller_visible_notes: Deployment-defined text and tool-agent group with validated targets.
      intended_workloads: [coding, tool_agent, repo_analysis]
      supported_api_shapes: [openai_chat]
      required_capabilities:
        input_modalities: [text]
        output_modalities: [text]
        honors_max_tokens_when_caller_capped: true
      quality_floor:
        require_tags: [validated]
        min_eval_quality_score: 0.90
        min_eval_pass_rate: 0.95
        allowed_validation_status: [passed]
      operational_targets:
        max_error_rate: 0.03
        max_timeout_rate: 0.02
        max_p95_latency_ms: 10000
      reporting:
        expose_workload_labels: true
        expose_quality_floor_bucket: true
    targets:
    - provider: baseten
      model_ref: gpt-oss-120b
      weight: 60
      tags: [validated, coding, tool_capable]
      validation:
        status: passed
        workload: coding
        validated_at: "2026-06-22"
        quality_score: 0.93
        pass_rate: 0.97
        harness: harbor
    - provider: minimax
      model_ref: m3
      weight: 25
      tags: [validated, low_cost, tool_capable]
      validation:
        status: passed
        workload: tool_agent
        validated_at: "2026-06-17"
        quality_score: 0.91
        pass_rate: 0.96
        harness: router-tool-smoke
    - provider: openai
      model_ref: gpt-5.4-nano
      weight: 5
      # GPT-5.4 Nano did not meet the receipt OCR quality gate.
      input_modalities: [text]
      tags: [validated, fallback]
      validation:
        status: passed
        workload: fallback_text
        validated_at: "2026-06-17"
        quality_score: 0.90
        pass_rate: 0.95
        harness: direct-text-smoke
    routing_policy:
      dynamic_score:
        cold_start_policy: configured_weight
        min_observations: 20
        observation_window_seconds: 600
        max_score_adjustment_percent: 70
        # Prefix affinity is enabled by default. Pins are process-local,
        # caller-isolated, and honored only while the target remains eligible.
        affinity:
          ttl_seconds: 600
          max_entries: 10000
        hard_filters:
          require_requested_api_skin: true
          require_input_modalities: true
          require_tool_support_when_tools_present: true
          require_honors_max_tokens_when_caller_capped: true
        signals:
          request_shape:
            enabled: true
          prompt_features:
            enabled: true
            max_scan_bytes: 16384
            features: [code, diff, stack_trace, summarize, extract, security_review, tool_agent]
          complexity:
            enabled: true
          observed_performance:
            enabled: true
          cost:
            enabled: true
          evaluation_metadata:
            enabled: true
        score_terms:
        - name: cheapest_fast_enough
          when:
            complexity_lte: standard
          expression: "0.45 * cost_score + 0.25 * latency_score + 0.20 * throughput_score + 0.10 * reliability_score"
        - name: complex_quality_floor
          when:
            complexity_gte: complex
          require_tags: [validated]
          expression: "0.45 * eval_quality_score + 0.25 * reliability_score + 0.20 * latency_score + 0.10 * cost_score"
        thresholds:
          max_error_rate: 0.03
          max_timeout_rate: 0.02
          max_p95_latency_ms: 10000
  default:
    strategy: weighted
    targets:
    - provider: baseten
      model_ref: gpt-oss-120b
      weight: 51
    - provider: minimax
      model_ref: m3
      weight: 24
    - provider: baseten
      model_ref: nemotron-120b-a12b
      weight: 3
    - provider: baseten
      model_ref: glm-5-2
      weight: 5
    - provider: openrouter

server:
  listen: :8080
  default_model_group: default
  # Optional OpenAI endpoint compatibility gates. Disabled by default so
  # `/v1/chat/completions` accepts Chat Completions bodies and rejects
  # Responses-shaped bodies clearly. Enable only for deployments that have
  # validated clients which post Responses-shaped payloads to the Chat endpoint.
  openai_compatibility:
    tolerate_responses_body_on_chat_endpoint: false
  cache:
    # Disabled by default until operators enable caller-scoped deterministic caching.
    enabled: false
    max_bytes: 134217728
    default_ttl: 15m
  logging:
    path: requests.jsonl
    rotate_mb: 256
    keep: 14
  usage_db:
    enabled: true
    driver: sqlite
    path: usage.sqlite
    # Serving binaries do not apply application DDL. Run router-migrate as the
    # reviewed deployment job, then keep startup in deployment-job validation.
    migration_policy: deployment-job
  # Optional offline signed JSON license enforcement. Disabled by default so a
  # normal go build / run needs no license file. Operators may set enabled: true
  # and point path at a signed license.json when they want runtime policy gates.
  license:
    enabled: false
    path: /app/config/license.json
    state_path: /app/state/license-state.json
    # Set exactly one fingerprint source when the operator issues an instance-bound
    # license for this deployment. The router hashes the effective fingerprint
    # before matching modern licenses and never exposes the raw value in status.
    instance_fingerprint: ""
    instance_fingerprint_file: ""
    instance_fingerprint_env: ""
    recheck_interval: 1h
    grace_period_on_validation_error: 24h
    # Optional signed revocation-bundle enforcement. Keep mode off unless the
    # operator maintains a signed revocations.json bundle for this deployment.
    revocation:
      mode: off
      path: /app/config/revocations.json
      require_current_bundle: false
      fail_closed_on_bundle_error: true
    fail_open_for_dev: false
  # Optional normalized routing-decision telemetry. Disabled by default.
  # When enabled, the router writes safe scalar child rows keyed by request_id
  # for request shape features, target candidates, target filter reason buckets,
  # selected routing decisions, routing signals, score/ranking terms, policy
  # executions, fallback transitions, cache hit/miss/bypass reason buckets, and
  # non-secret routing fingerprints on request usage rows.
  decision_telemetry:
    enabled: false
    max_candidates: 64
    max_filter_reasons: 256
    record_candidates: true
    record_cache_reasons: true
  upstream:
    timeout_ms: 600000
    default_attempt_timeout_ms: 0
    # Successful upstream responses larger than this are rejected before decode.
    max_response_bytes: 33554432
    # Keep false unless a reviewed private VLM deployment intentionally bypasses
    # all router image-URL admission, including scheme, host/address, and DNS
    # checks. The router forwards URLs; enforce destination and redirect safety
    # with deployment egress controls. Data/base64 images do not need this opt-in.
    allow_private_image_urls: false
  diagnostics:
    enabled: true
    retention_days: 30
    # When true, provider 4xx/5xx bodies can add bounded scalar rows to
    # request_upstream_error_details for allowlisted fields such as code, type,
    # param, provider request ID, and sanitized message. This never stores raw
    # upstream bodies, prompts, images, tool schemas, bearer tokens, provider
    # keys, or token hashes. Defaults to true when diagnostics are enabled;
    # set false only for deployments that want to suppress provider detail rows.
    store_sanitized_upstream_errors: true
    max_error_bytes: 2048
  # Optional caller/server traffic shaping smooths short bursts before upstream
  # calls. It is separate from hard rpm/tpm/concurrent limits and quotas.
  # Bucket state is process-local and resets on restart. Caller-level
  # traffic_shape overrides this default; set enabled: false on a caller to opt
  # out of an enabled server default.
  traffic_shape:
    enabled: false
    default_caller:
      request_start_per_sec: 0
      request_burst: 0
      input_tokens_per_sec: 0
      input_token_burst: 0
      output_reservation_tokens_per_sec: 0
      output_reservation_token_burst: 0
      total_reserved_tokens_per_sec: 0
      total_reserved_token_burst: 0
      queue:
        enabled: false
        max_wait_ms: 0
        max_depth: 0
  # Browser-admin HTTP Basic authentication is disabled by default. It only
  # establishes an admin subject; control-plane authorization uses explicit
  # Casbin grants under server.admin_auth.authorization.
  admin_auth:
    basic:
      enabled: false
      realm: Metrum AI Router Admin
      allow_insecure_http: false
      trusted_proxy_cidrs: []
      users: []
      # Example enabling shape, using a deployment secret for the bcrypt hash:
      # users:
      # - username: admin
      #   password_hash_env: SMART_ROUTER_ADMIN_PASSWORD_HASH
      #   subject: basic:admin
      #   domain: example/prod
      #   permissions:
      #   - admin:auth:read
    oidc:
      enabled: false
      issuer_url: https://accounts.google.com
      client_id_env: GOOGLE_OIDC_CLIENT_ID
      client_secret_env: GOOGLE_OIDC_CLIENT_SECRET
      redirect_url: https://router.example.com/admin/auth/callback
      scopes:
      - email
      - profile
      allowed_domains:
      - example.com
      groups_claim: groups
      email_claim: email
      subject_claim: email
      domain: example/prod
    sessions:
      cookie_name: smart_router_admin_session
      ttl: 8h
      secure_cookies: true
      same_site: strict
    authorization:
      enabled: false
      # source: static loads deployment-owned policy_file and inline policy.
      # source: db loads the single active policy set from the usage DB and
      # fails closed at startup if no active validated policy set exists.
      source: static
      policy_file: ''
      policy: []
      # Example Casbin policy for metrics, admin reports, and content maintenance after AuthN is enabled.
      # Use policy_file for deployment-owned CSV files, or inline policy for small installs.
      # For DB-backed policy lifecycle, create policy rows in the usage DB, validate
      # and activate them through admin-safe tooling, then set source: db.
      # policy:
      # - g, caller:ops-metrics-key, metrics_admin, example/prod
      # - g, caller:content-admin-key, content_admin, example/prod
      # - g, basic:admin, reports_admin, example/prod
      # - g, user:alice@example.com, reports_admin, example/prod
      # - p, metrics_admin, example/prod, metrics, read
      # - p, content_admin, example/prod, content:capture, delete|purge
      # - p, reports_admin, example/prod, admin:reports, read|export|drilldown
      # - p, reports_admin, example/prod, admin:security_reports, read|export
  admin_reports:
    enabled: false
    path_prefix: /admin/reports
    default_since: 24h
    max_range: 31d
    max_rows: 500
    export_markdown: true
    baselines:
      - id: gpt-5.5
        name: GPT-5.5
        input_price_per_million_usd: 5.00
        output_price_per_million_usd: 30.00
        pricing_source: https://developers.openai.com/api/docs/pricing
        pricing_updated_at: "2026-06-25"
        notes: OpenAI API standard text token pricing checked on 2026-06-25.
      - id: claude-opus-4.8
        name: Claude Opus 4.8
        input_price_per_million_usd: 5.00
        output_price_per_million_usd: 25.00
        pricing_source: https://docs.anthropic.com/en/docs/about-claude/pricing
        pricing_updated_at: "2026-06-25"
        notes: Anthropic Claude API standard token pricing checked on 2026-06-25; fast mode and batch pricing are separate.
    security:
      enabled: false
      retention_days: 90
  client_ip:
    trusted_proxy_cidrs: []
    header_order:
      - X-Forwarded-For
      - X-Real-IP
    store_ip: true
  # Governed content capture is disabled by default. Enabling it stores redacted
  # request/response/upstream-error content in separate relational tables keyed
  # by request_id. It is not diagnostics, metrics, or usage reporting. Delete
  # maintenance requires content:capture delete authorization for the captured
  # row's project/environment domain, not only the actor's own domain. Capture
  # cannot be enabled unless encryption.enabled is true, local_key_id identifies
  # the local AES key, and CONTENT_CAPTURE_LOCAL_KEY supplies the associated
  # 32-byte hex/base64 key through the deployment secret boundary.
  content_capture:
    enabled: false
    retention_days: 30
    capture_request: false
    capture_response: false
    capture_tool_calls: false
    capture_images: false
    capture_upstream_errors: false
    capture_headers_allowlist: []
    redact_before_storage: true
    redaction_patterns: []
    max_capture_bytes: 65536
    encryption:
      enabled: false
      local_key_id: ""
  # Commercial retention foundation. Defaults are conservative and dry-run.
  # When dry_run is false, the CLI deletes at most one configured batch for
  # usage_diagnostics, content_capture, and usage_detail; usage_detail remains
  # blocked until finalized daily rollups cover the candidate window.
  retention:
    enabled: false
    dry_run: true
    default_batch_size: 500
    classes:
      - data_class: usage_diagnostics
        enabled: true
        retention_days: 30
        batch_size: 500
      - data_class: decision_telemetry
        enabled: true
        retention_days: 30
        batch_size: 500
      - data_class: security_access_events
        enabled: true
        retention_days: 90
        batch_size: 500
      - data_class: content_capture
        enabled: true
        retention_days: 30
        batch_size: 500
      - data_class: usage_detail
        enabled: false
        retention_days: 365
        batch_size: 500
        require_finalized_rollup: true
state_path: router-state.json
providers:
  kimi:
    base_url: https://api.moonshot.ai/v1
    dialect: openai-chat
    api_key: ${MOONSHOT_API_KEY}
    api_key_env: MOONSHOT_API_KEY
    key_id: moonshot-kimi-default
    models:
      kimi-k2.7-code:
        model: kimi-k2.7-code
        tier: heavy
        input_price_per_million_usd: 0.74
        output_price_per_million_usd: 3.5
        pricing_source: https://platform.kimi.ai/docs/pricing/chat-k27-code
        pricing_updated_at: '2026-06-17'
        request_shape_support:
          supported_inbound_dialects: [openai-chat, anthropic]
          unsupported_request_features: [stream_options]
          validation_status: passed
          validation_notes: Router-level Anthropic Messages to OpenAI Chat text
            translation is validated for broad coding groups; use the dedicated
            Kimi Anthropic provider skin for Claude Code client tools. Production-derived
            opencode/AI SDK Chat requests with stream_options caused upstream 400s
            on 2026-07-09; keep that shape gated until direct and router-level
            smokes pass for this exact provider/model/skin. Production big-coder
            composition changes still require operator confirmation.
        tool_support:
          openai_chat:
          - tools
          - tool_choice
      kimi-k3:
        model: kimi-k3
        tier: frontier
        context_tokens: 1000000
        input_modalities: [text]
        output_modalities: [text]
        input_price_per_million_usd: 3.0
        output_price_per_million_usd: 15.0
        pricing_source: https://platform.kimi.ai/
        pricing_updated_at: '2026-07-19'
        request_shape_support:
          supported_inbound_dialects: [openai-chat]
        pricing_notes: Kimi K3 direct OpenAI Chat text, SSE streaming, max_tokens=1,
          JSON-schema, auto/forced function-tool, function-result continuation,
          and 524 KB synthetic 24-tool payload smokes passed on 2026-07-19. K3
          rejects forced tool_choice while its upstream thinking mode is enabled;
          configure default_openai_chat_thinking.type=disabled only on a target
          that passed the same router-level smokes. Do not claim OpenAI Responses
          support because the native endpoint returned 404. Explicit caller
          reasoning remains separately eligible and must not be inferred from
          this compatibility default.
        tool_support:
          openai_chat:
          - tools
          - tool_choice
          - structured_outputs
  xai:
    base_url: https://api.x.ai/v1
    dialect: openai-chat
    api_key: ${XAI_API_KEY}
    api_key_env: XAI_API_KEY
    key_id: xai-default
    models:
      grok-4-3:
        model: grok-4.3
        tier: heavy
        input_price_per_million_usd: 1.25
        output_price_per_million_usd: 2.5
        image_input_price_per_million_tokens_usd: 1.25
        input_modalities:
        - text
        - image
        output_modalities:
        - text
        pricing_source: https://docs.x.ai/developers/models/grok-4.3
        pricing_updated_at: '2026-06-17'
        pricing_notes: catalog-only until a valid XAI_API_KEY passes direct text and image
          smokes
        tool_support:
          openai_chat:
          - tools
          - structured_outputs
      grok-4-5:
        model: grok-4.5
        tier: coding
        input_price_per_million_usd: 2.0
        # Optional: omit when unknown; set 0 when cache reads are known free.
        cached_input_price_per_million_usd: 0.5
        output_price_per_million_usd: 6.0
        input_modalities:
        - text
        output_modalities:
        - text
        pricing_source: https://docs.x.ai/developers/pricing
        pricing_updated_at: '2026-07-09'
        pricing_notes: xAI pricing checked on 2026-07-09 lists Grok 4.5 with
          500K context, $2.00/M input, $0.50/M cached input, and $6.00/M
          output. Direct xAI smokes passed on 2026-07-09 for Chat text,
          Chat streaming, max_tokens=1 cap, OpenAI Chat auto and forced
          function tools, JSON schema structured outputs, reasoning_effort
          low/medium, Responses text, and Responses JSON schema structured
          outputs. Local router-level OpenAI Chat smokes passed on 2026-07-09
          for text, reasoning_effort low, forced function tools, structured
          outputs, /v1/models reasoning metadata, usage, latency, cost, and
          no fallback. This catalog entry is text-only until direct and
          router-level image smokes pass for this exact model and endpoint.
        request_shape_support:
          supported_inbound_dialects: [openai-chat, anthropic]
          unsupported_request_features: [stream_options]
          validation_status: passed
          validation_notes: Anthropic Messages text/thinking translation to this
            OpenAI Chat skin is allowed for broad coding groups; Claude Code
            client tools still require Anthropic Messages targets. Production-derived
            opencode/AI SDK Chat requests with stream_options caused mixed upstream
            400s on 2026-07-09; keep that shape gated until direct and router-level
            smokes pass for this exact provider/model/skin. Production big-coder
            composition changes still require operator confirmation.
        tool_support:
          openai_chat:
          - tools
          - tool_choice
          - structured_outputs
        reasoning:
          supported: true
          mode: opt_in
          control: effort_enum
  baseten:
    base_url: https://inference.baseten.co/v1
    dialect: openai-chat
    api_key: ${BASETEN_API_KEY}
    api_key_env: BASETEN_API_KEY
    key_id: baseten-default
    # Optional deployment-wide shared upstream protection. These buckets are
    # shared across all caller keys for this provider skin and are disabled by
    # default when omitted. Provider/model/target shaping protects upstream
    # account capacity; caller rate/quota fields still enforce caller policy.
    traffic_shape:
      enabled: false
      request_start_per_sec: 10
      request_burst: 30
      input_tokens_per_sec: 500000
      input_token_burst: 1500000
      total_reserved_tokens_per_sec: 750000
      total_reserved_token_burst: 2000000
      upstream_429_backoff:
        enabled: true
        min_backoff_ms: 1000
        max_backoff_ms: 60000
        multiplier: 2.0
        honor_retry_after: true
      upstream_quota_backoff:
        enabled: true
        min_backoff_ms: 30000
        max_backoff_ms: 300000
        multiplier: 2.0
        honor_retry_after: true
    models:
      nemotron-120b-a12b:
        model: nvidia/Nemotron-120B-A12B
        tier: heavy
        input_price_per_million_usd: 0.3
        output_price_per_million_usd: 0.75
        input_modalities:
        - text
        output_modalities:
        - text
        pricing_source: https://www.baseten.co/pricing/
        pricing_updated_at: '2026-06-17'
        pricing_notes: Baseten pricing page also lists $0.06/M cache input for NVIDIA Nemotron
          3 Super; router usage rows currently log standard input/output token rates plus
          any upstream-reported billed cost.
        tool_support:
          openai_chat:

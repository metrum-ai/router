  - agent-tools-smoke-openrouter
  - claude-tools-smoke-openrouter
  - claude-tools-smoke-openrouter-gemma
  - baseten-nemotron-smoke
  - warp-agent-smoke
  - baseten-glm52-smoke
  - baseten-gpt-oss-120b-smoke
  - fireworks-gpt-oss-20b-smoke
  - large-openai-chat-tools-smoke
  - fireworks-responses-smoke
  - fireworks-responses-tool-smoke
  - minimax-responses-smoke
  - minimax-responses-tool-smoke
  - baseten-gpt-oss-120b-claude-smoke
  - crusoe-smoke
  - crusoe-gemma-smoke
  - crusoe-nemotron-omni-smoke
  - openai-gpt54-vision-smoke
  - reasoning-smoke
  - reasoning-bridge-smoke
  - responses-to-chat-bridge-smoke

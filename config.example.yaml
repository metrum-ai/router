      model_ref: kimi-k2p7-code
      # Opt-in bridge for validating Chat Completions callers against a
      # Responses-only target. Keep this in smoke groups until text, tool,
      # diagnostics, optional session behavior, and caller compatibility smokes
      # pass for the exact target.
      bridges:
        chat_to_responses:
          enabled: true
          # Optional stateful session bridge. When enabled and callers send the
          # configured header, the router stores the last upstream Responses id
          # and injects it as previous_response_id on the next Chat request in
          # the same caller/group/target/session scope. Memory is the default
          # single-process backend. Use backend: redis for multi-replica
          # deployments after Redis connectivity, auth, TLS, TTL, stale-purge,
          # and stateless-retry smokes pass.
          stateful_sessions:
            enabled: false
            backend: memory
            session_header: X-Router-Session
            ttl_seconds: 3600
            max_entries: 10000
            # Redis is disabled unless backend is set to redis. Keep credentials
            # in environment variables; do not put Redis passwords in config.
            # redis:
            #   address: redis.example.internal:6379
            #   namespace: smart-router-prod
            #   db: 0
            #   username_env: ROUTER_BRIDGE_REDIS_USERNAME
            #   password_env: ROUTER_BRIDGE_REDIS_PASSWORD
            #   tls:

users:
# Account identities are explicit and stable. Caller keys reference user ids
# with owner_user; legacy callers[].user is still accepted as a deprecated alias.
# User, project, and membership statuses support active, disabled, suspended,
# removed, and archived. Caller key statuses also support expired and rotated.
- id: standard
  name: Standard API Caller
  type: service_account
  status: active
- id: coding
  name: Coding Agent API Caller
  type: service_account
  status: active
- id: metrics-admin
  name: Metrics Admin API Caller
  type: service_account
  status: active
- id: content-admin
  name: Content Capture Admin API Caller
  type: service_account
  status: active
projects:
- id: example-project
  name: Example Project
  status: active
- id: observability
  name: Observability
  status: active
- id: compliance
  name: Compliance
  status: active
project_memberships:
- user_id: standard
  project: example-project
  role: developer
  status: active
- user_id: coding
  project: example-project
  role: developer
  status: active
- user_id: metrics-admin
  project: observability
  role: operator
  status: active
- user_id: content-admin
  project: compliance
  role: operator
  status: active
callers:
# Each caller id, token_sha256, and non-empty token_id must be unique. Token
# hashes are compared case-insensitively, and duplicate-hash validation errors
# name the caller ids without printing the hash value.
- id: standard-dev
  owner_user: standard
  project: example-project
  environment: dev
  status: active
  token_sha256: REPLACE_WITH_SHA256_HEX_OF_STANDARD_ROUTER_TOKEN
  token_id: rtr_metrum_standard_example-project_dev_kreplace
  metrics_admin: false
  content_admin: false
  allow:
  - default
  - fast
  - small
  - vision
  - external-policy-demo
  rate:
    rpm: 120
    tpm: 200000
    concurrent: 8
  # Conservative production-style traffic shaping smooths request starts and
  # large context/output reservations before upstream calls. This sample uses a
  # bounded queue so short bursts can wait briefly for bucket refill; disable
  # queueing for latency-sensitive keys that should fail fast.
  traffic_shape:
    enabled: true
    request_start_per_sec: 3.0
    request_burst: 12
    input_tokens_per_sec: 150000
    input_token_burst: 900000
    output_reservation_tokens_per_sec: 120000
    output_reservation_token_burst: 500000
    total_reserved_tokens_per_sec: 240000
    total_reserved_token_burst: 1200000
    queue:
      enabled: true
      max_wait_ms: 8000
      max_depth: 32
  quota:
    day:
      requests: 5000
      tokens: 20000000
    month:
      requests: 0
      tokens: 400000000
    soft_pct: 80
  key:
    lifetime_tokens: 2000000000
    soft_pct: 90
    on_exhaust: disable
  # Caller entitlement for semantic/dynamic_score escalation. Merges with group
  # spend_ceiling when both are set. Does not apply to weighted/static/failover.
  spend_ceiling:
    max_estimated_cost_usd: 0.08
    max_tier: standard
- id: coding-dev
  owner_user: coding
  project: example-project
  environment: dev
  status: active
  token_sha256: REPLACE_WITH_SHA256_HEX_OF_CODING_ROUTER_TOKEN
  token_id: rtr_metrum_coding_example-project_dev_kreplace
  metrics_admin: false
  content_admin: false
  allow:

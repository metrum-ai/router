        tier: coding
        input_price_per_million_usd: 1.5
        output_price_per_million_usd: 4.5
        input_modalities:
        - text
        output_modalities:
        - text
        pricing_source: https://www.baseten.co/pricing/
        pricing_updated_at: '2026-06-18'
        pricing_notes: 'Baseten Model API pricing also lists $0.30/M cache input. Direct Baseten
          smokes passed on 2026-06-18 for realistic-budget text, max_tokens cap enforcement,
          and OpenAI Chat tool calls. Reasoning-heavy: max_tokens=128 can be spent entirely

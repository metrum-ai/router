[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "metrum-learned-routing-policy"
version = "0.1.0"
description = "Outcome-trained external routing policy and offline training CLI"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "onnxruntime>=1.20,<2",
  "tokenizers>=0.21,<1", "lightgbm>=4.5,<5", "numpy>=2,<3",
  "pandas>=2.2,<3", "pyarrow>=19,<24", "pydantic>=2.10,<3",
  "httpx>=0.28,<1", "prometheus-client>=0.21,<1", "PyYAML>=6,<7",
  "scikit-learn>=1.6,<2", "scipy>=1.15,<2", "jsonschema>=4.23,<5", "onnx>=1.17,<2",
  "langdetect>=1.0.9,<2", "cryptography>=48.0.1,<51",
]

[project.optional-dependencies]
# Optional sentence-transformers path. Does not change the default CPU lockfile.
# Install with: uv sync --project services/learned-routing-policy --extra embed-st
embed-st = [
  "sentence-transformers>=3.0,<6",
  "torch>=2.2,<3",
]

[project.scripts]
lrp = "lrp.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "hypothesis>=6,<7", "respx>=0.22,<1", "ruff>=0.11,<1", "mypy>=1.15,<2", "types-PyYAML", "pandas-stubs", "types-jsonschema"]

[tool.hatch.build.targets.wheel]
packages = ["lrp"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

# Deployment-defined demonstration group; pins and exploration are opt-in.
groups:
  lrp-demo:
    quality_floor: 0.80
    # Optional per-project floors keyed on caller.project (generic demo names only).
    # Unknown projects fall back to quality_floor. Never hardcode production IDs.
    floors_by_project:
      demo-strict: 0.90
      demo-loose: 0.70
    explore_rate: 0.0
    exploration_projects: []
    # Wave-2 defaults preserve v1 epsilon-greedy; enable deliberately.
    exploration_strategy: epsilon_greedy
    uncertainty_abstention: false
    uncertainty_threshold: 0.15
    cold_start_exploration: false
    auto_shadow_on_drift: false
    psi_threshold: 0.25
    embedding_drift_threshold: 0.15
    pin_ttl_s: 0
    min_train_rows: 200
    # Optional upstream latency gate (p95 ms) from stored duration/TTFB evidence.
    # Omit or null to disable. Cold-start targets follow unknown_latency.
    latency_p95_ms_max: null
    latency_metric: duration  # or ttfb
    unknown_latency: allow  # allow | exclude
    # Optional static p95 seeds from offline eval; feedback updates supersede these.
    latency_evidence: {}
    # Router external_policy.mode owns shadow activation. LRP returns its recommendation.
    mode: enforce
max_pins: 10000
inference_workers: 2
# 1..4500 ms; increasing this trades routing latency for more inference time.
# Router external_policy.timeout_ms must exceed this with transport headroom
# (for example, deadline_ms: 500 with router timeout_ms: 750; router max 5000).
deadline_ms: 200
# Embedding backend defaults for operators. Bundle artifacts remain authoritative
# at serve. onnxruntime is the default path, not the only path.
# CLI: --embedding-backend onnxruntime|sentence-transformers
embedding:
  backend: onnxruntime  # onnxruntime | sentence-transformers
  model: /operator-owned/embed/model.onnx
  max_seq_len: 512
  batch_size: 1
# Shared train/serve device. cpu is the compatibility default.
# auto prefers CUDA, then ROCm, then CPU. CUDA ORT requires operator-installed
# onnxruntime-gpu. sentence-transformers needs the embed-st optional group.
compute:
  device: cpu  # auto | cpu | cuda:N | rocm
  strict_device: false

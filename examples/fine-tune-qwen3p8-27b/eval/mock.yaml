prompts: ['Synthetic fixture: {{case}}']
providers: [file://mock.cjs]
tests:
  - vars:
      case: exact
      output: {tool_calls: [{function: {name: lookup, arguments: '{"id":1}'}}]}
      expected: [{function: {name: lookup, arguments: '{"id":1}'}}]
      declared: [lookup]
    assert:
      - {type: python, value: 'file://scorers/tools.py'}
      - {type: is-json}
      - type: contains-json
        value:
          type: object
          required: [tool_calls]
          properties:
            tool_calls: {type: array, items: {type: object, required: [function]}}
  - vars:
      case: planted-mismatch
      output: [{function: {name: hallucination, arguments: '{}'}}]
      expected: [{function: {name: lookup, arguments: '{"id":1}'}}]
      declared: [lookup]
    assert:
      - type: not-python
        value: file://scorers/tools.py

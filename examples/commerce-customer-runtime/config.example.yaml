# Minimal instance-only router config template for commerce bootstrap.
# Provider keys belong in env.json beside this file (see env.example.json).
# Do not place Stripe, restic, backup, or commerce admin secrets in this bundle.
#
# Durable state under /var/lib/smart-llmrouter is the conventional layout for
# containerized installs.
# Router state_path is a TOP-LEVEL Config field (not under server:); nesting it
# under server: is ignored and defaults to relative router-state.json (CrashLoop).
server:
  listen: :8080
  default_model_group: default
  cache:
    enabled: true
    max_bytes: 134217728
    default_ttl: 15m
  logging:
    path: /var/lib/smart-llmrouter/requests.jsonl
    rotate_mb: 256
    keep: 14
  usage_db:
    enabled: true
    driver: sqlite
    path: /var/lib/smart-llmrouter/usage.sqlite
    migration_policy: deployment-job
  # eval-72h (and similar) licenses set max_retention_days: 7; diagnostics
  # default to 30 and fail readyz with license-retention-limit-exceeded.
  diagnostics:
    enabled: true
    retention_days: 7
    store_sanitized_upstream_errors: true
    max_error_bytes: 2048
  retention:
    enabled: false
  license:
    enabled: true
    path: /etc/smart-llmrouter-license/license.json
    state_path: /var/lib/smart-llmrouter/license-state.json
    instance_fingerprint: ""
    recheck_interval: 1h
    grace_period_on_validation_error: 24h
    revocation:
      mode: off
      path: /etc/smart-llmrouter-license/revocations.json
    fail_open_for_dev: false

state_path: /var/lib/smart-llmrouter/router-state.json

providers:
  openai:
    dialect: openai-chat
    base_url: https://api.openai.com/v1
    api_key: ${OPENAI_API_KEY}
    api_key_env: OPENAI_API_KEY
    models:
      gpt-4o-mini:
        model: gpt-4o-mini
        input_price_per_million_usd: 0.15
        output_price_per_million_usd: 0.60
        pricing_source: placeholder
        pricing_updated_at: "2026-08-20"
        input_modalities: [text]
        output_modalities: [text]
        tool_support:
          openai_chat: [tools, tool_choice]

models:
  default:
    strategy: weighted
    targets:
      - provider: openai
        model: gpt-4o-mini
        weight: 100

users:
  - id: bootstrap-owner
    display_name: Bootstrap Owner
    status: active

projects:
  - id: bootstrap
    display_name: Bootstrap
    status: active

project_memberships:
  - user_id: bootstrap-owner
    project: bootstrap
    status: active
    role: owner

callers: []

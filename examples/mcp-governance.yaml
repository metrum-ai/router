mcp:
  enabled: true
  timeout_ms: 30000
  servers:
    - name: knowledge
      url: https://mcp.example.invalid/rpc
      allow_hosts: [mcp.example.invalid]
      credential_env: ROUTER_MCP_KNOWLEDGE_TOKEN
  rpm: 60
  limits:
    - caller: support-bot
      tool: knowledge/search
      rpm: 30
      cost_per_call_usd: 0.01
      hourly_usd: 2
      daily_usd: 10
  policies:
    - project: support
      deny_by_default: true
      tools:
        - knowledge/search
        - knowledge/send

# Model-group PII rules also govern MCP tool arguments and results. Enable the
# built-in secret pack to mask known credential formats.
models:
  default:
    pii_filter:
      enabled: true
      secrets_enabled: true
      mode: redact_only
      apply_to:
        messages: true
        tool_results: true

# Firewall hold rules use the same qualified MCP tool names and approval API as
# other tool calls. MCP sequence state is scoped to the authenticated caller.
admin:
  enabled: true

server:
  tool_firewall:
    mode: enforce
    approval_timeout_ms: 60000
    sequences:
      - first_tool: knowledge/search
        first_args_regex: "sensitive"
        then_tool: knowledge/send
        within_turns: 3
        action: hold

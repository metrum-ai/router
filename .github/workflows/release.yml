name: Release artifacts

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build (for example v2.0.0). Build-only unless this run is already on that tag ref."
        required: true

permissions:
  contents: write
  id-token: write
  packages: write

jobs:
  package:
    runs-on: [self-hosted, Linux, X64, router]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            docs-site/package-lock.json
            internal/router/admindist/web/package-lock.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Resolve version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi
      - name: Build packages
        run: |
          export VERSION="${{ steps.version.outputs.tag }}"
          make package package-docker
      - name: Inventory and checksums
        run: |
          python3 scripts/release_artifact_inventory.py \
            --dist-dir dist \
            --version "${{ steps.version.outputs.tag }}" \
            --commit "$(git rev-parse HEAD)" \
            --build-date "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
      - name: Upload inventory-validated release assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: metrum-ai-router-${{ steps.version.outputs.tag }}
          path: |
            dist/metrum-ai-router-*.tar.gz
            dist/SHA256SUMS
            dist/release-artifacts.json
          if-no-files-found: error
      - name: Publish GitHub Release with assets
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ steps.version.outputs.tag }}"
          if [ "${GITHUB_REF_NAME}" != "${TAG}" ]; then
            echo "ref tag ${GITHUB_REF_NAME} does not match resolved version ${TAG}" >&2
            exit 2
          fi
          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "GitHub Release ${TAG} already exists." >&2
            echo "This repository uses immutable releases, so assets cannot be uploaded after the fact." >&2
            echo "Do not create an empty release first. Push the annotated tag and let this workflow create the release with inventory-validated assets in one step." >&2
            exit 1
          fi
          mapfile -t ASSETS < <(
            {
              find dist -maxdepth 1 -type f -name 'metrum-ai-router-*.tar.gz'
              printf '%s\n' dist/SHA256SUMS dist/release-artifacts.json
            } | sort -u
          )
          if [ "${#ASSETS[@]}" -eq 0 ]; then
            echo "no inventory-validated dist assets found to attach to ${TAG}" >&2
            exit 1
          fi
          for asset in "${ASSETS[@]}"; do
            if [ ! -f "${asset}" ]; then
              echo "missing required release asset: ${asset}" >&2
              exit 1
            fi
          done
          NOTES_FILE="$(mktemp)"
          if git cat-file -t "refs/tags/${TAG}" 2>/dev/null | grep -qx tag; then
            git tag -l --format='%(contents)' "${TAG}" > "${NOTES_FILE}"
          fi
          if [ ! -s "${NOTES_FILE}" ]; then
            printf 'Metrum AI Router %s\n' "${TAG}" > "${NOTES_FILE}"
          fi
          # Dry-run the exact publication command shape before mutate.
          printf 'gh release create %s --verify-tag --title %s --notes-file %s' "${TAG}" "Metrum AI Router ${TAG}" "${NOTES_FILE}"
          printf ' %q' "${ASSETS[@]}"
          printf '\n'
          gh release create "${TAG}" \
            --verify-tag \
            --title "Metrum AI Router ${TAG}" \
            --notes-file "${NOTES_FILE}" \
            "${ASSETS[@]}"

name: Release artifacts

on:
  push:
    tags:
      - "v*"
permissions:
  contents: read

jobs:
  # Every hierarchy compatibility cell must pass before release packaging.
  hierarchy-matrix:
    if: startsWith(github.ref, 'refs/tags/')
    uses: ./.github/workflows/hierarchy-matrix.yml
    permissions:
      contents: read

  resolve:
    if: startsWith(github.ref, 'refs/tags/')
    needs: hierarchy-matrix
    runs-on: ${{ vars.ROUTER_HEAVY_RUNNER || 'router-arc' }}
    outputs:
      tag: ${{ steps.metadata.outputs.tag }}
      commit: ${{ steps.metadata.outputs.commit }}
      build_date: ${{ steps.metadata.outputs.build_date }}
      source_date_epoch: ${{ steps.metadata.outputs.source_date_epoch }}
      previous_tag: ${{ steps.metadata.outputs.previous_tag }}
      previous_commit: ${{ steps.metadata.outputs.previous_commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install pinned GitHub CLI
        run: bash scripts/install_github_cli.sh "${RUNNER_TEMP}/gh-cli/bin"
      - name: Resolve immutable build metadata
        id: metadata
        env:
          RELEASE_REF_NAME: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="$(python3 scripts/validate_release_tag.py "${RELEASE_REF_NAME}")"
          commit="$(git rev-parse HEAD)"
          git fetch origin main
          if ! git merge-base --is-ancestor "${commit}" origin/main; then
            echo "release tag commit is not an ancestor of origin/main" >&2
            exit 1
          fi
          source_date_epoch="$(git show -s --format=%ct HEAD)"
          build_date="$(date -u -d "@${source_date_epoch}" +%Y-%m-%dT%H:%M:%SZ)"
          previous_tag="$(gh release list --repo "${GITHUB_REPOSITORY}" --limit 100 --json tagName,isPrerelease,isDraft | python3 scripts/select_previous_release.py --current "${tag}")"
          previous_commit="$(git rev-parse --verify "${previous_tag}^{commit}")"
          printf 'tag=%s\n' "${tag}" >> "${GITHUB_OUTPUT}"
          printf 'commit=%s\n' "${commit}" >> "${GITHUB_OUTPUT}"
          printf 'build_date=%s\n' "${build_date}" >> "${GITHUB_OUTPUT}"
          printf 'source_date_epoch=%s\n' "${source_date_epoch}" >> "${GITHUB_OUTPUT}"
          printf 'previous_tag=%s\n' "${previous_tag}" >> "${GITHUB_OUTPUT}"
          printf 'previous_commit=%s\n' "${previous_commit}" >> "${GITHUB_OUTPUT}"

  package-binaries:
    needs: resolve
    runs-on: ${{ vars.ROUTER_HEAVY_RUNNER || 'router-arc' }}
    timeout-minutes: 90
    env:
      VERSION: ${{ needs.resolve.outputs.tag }}
      COMMIT: ${{ needs.resolve.outputs.commit }}
      BUILD_DATE: ${{ needs.resolve.outputs.build_date }}
      SOURCE_DATE_EPOCH: ${{ needs.resolve.outputs.source_date_epoch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.commit }}
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Verify Go patch floor
        run: python3 scripts/check_go_toolchain.py
      - name: Generate engine advisory snapshot for release packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cat > "${RUNNER_TEMP}/engine-gate-requirements.txt" <<'EOF'
          PyYAML==6.0.3 \
            --hash=sha256:ba1cc08a7ccde2d2ec775841541641e4548226580ab850948cbfda66a1befcdc \
            --hash=sha256:9149cad251584d5fb4981be1ecde53a1ca46c891a79788c0df828d2f166bda28
          EOF
          python3 -m pip install --user --require-hashes --only-binary=:all: -r "${RUNNER_TEMP}/engine-gate-requirements.txt"
          python3 scripts/engine_advisory_gate.py --check --snapshot "${RUNNER_TEMP}/engine-advisories.json"
      - name: Build release binaries
        env:
          ENGINE_ADVISORY_SNAPSHOT: ${{ runner.temp }}/engine-advisories.json
        run: make package
      - name: Validate binary inventory and checksums
        run: python3 scripts/release_artifact_inventory.py --dist-dir dist --version "${VERSION}" --commit "${COMMIT}" --build-date "${BUILD_DATE}" --set binary --advisories-snapshot
      - name: Stage exact binary release payload
        run: python3 scripts/stage_release_payload.py --source dist --destination "${RUNNER_TEMP}/release-binaries" --version "${VERSION}" --without-upgrade-results
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-binaries
          path: ${{ runner.temp }}/release-binaries
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-engine-advisories
          path: ${{ runner.temp }}/engine-advisories.json
          if-no-files-found: error
          retention-days: 7

  reproducible-build:
    needs: [resolve, package-binaries]
    runs-on: ${{ vars.ROUTER_HEAVY_RUNNER || 'router-arc' }}
    timeout-minutes: 90
    env:
      VERSION: ${{ needs.resolve.outputs.tag }}
      COMMIT: ${{ needs.resolve.outputs.commit }}
      BUILD_DATE: ${{ needs.resolve.outputs.build_date }}
      SOURCE_DATE_EPOCH: ${{ needs.resolve.outputs.source_date_epoch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.commit }}
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: release-binaries
          path: ${{ runner.temp }}/primary-dist
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: release-engine-advisories
          path: ${{ runner.temp }}/advisory-snapshot
      - name: Rebuild binary packages on a clean runner
        env:
          GOCACHE: ${{ runner.temp }}/repro-go-build
          GOMODCACHE: ${{ runner.temp }}/repro-go-mod
          ENGINE_ADVISORY_SNAPSHOT: ${{ runner.temp }}/advisory-snapshot/engine-advisories.json
        run: |
          set -euo pipefail
          rm -rf "${GOCACHE}" "${GOMODCACHE}"
          make package
      - name: Recreate rebuilt inventory
        run: python3 scripts/release_artifact_inventory.py --dist-dir dist --version "${VERSION}" --commit "${COMMIT}" --build-date "${BUILD_DATE}" --set binary --advisories-snapshot
      - name: Compare package checksums
        run: python3 scripts/compare_release_checksums.py "${RUNNER_TEMP}/primary-dist/SHA256SUMS" dist/SHA256SUMS

  upgrade-and-rollback:
    needs: [resolve, package-binaries]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ${{ vars.ROUTER_HEAVY_RUNNER || 'router-arc' }}
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.commit }}
          fetch-depth: 0
      - name: Install pinned GitHub CLI
        run: bash scripts/install_github_cli.sh "${RUNNER_TEMP}/gh-cli/bin"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: release-binaries
          path: dist
      - name: Download and verify previous production package
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIOUS_TAG: ${{ needs.resolve.outputs.previous_tag }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/previous"
          gh release download "$PREVIOUS_TAG" -R metrum-ai/router \
            --pattern "metrum-ai-router-${PREVIOUS_TAG}-linux-amd64.tar.gz" \
            --pattern SHA256SUMS --dir "$RUNNER_TEMP/previous"
          cd "$RUNNER_TEMP/previous"
          grep -F "  metrum-ai-router-${PREVIOUS_TAG}-linux-amd64.tar.gz" SHA256SUMS | sha256sum --check -
      - name: Run upgrade and rollback checks
        env:
          PREVIOUS_TAG: ${{ needs.resolve.outputs.previous_tag }}
          CANDIDATE_TAG: ${{ needs.resolve.outputs.tag }}
          CANDIDATE_COMMIT: ${{ needs.resolve.outputs.commit }}
        run: |
          set -euo pipefail
          if [ "$(id -u)" -eq 0 ]; then
            useradd --system --home-dir /nonexistent --shell /usr/sbin/nologin router-release-check
            SERVICE_USER=router-release-check
          else
            SERVICE_USER="$(id -un)"
          fi
          python3 scripts/release_upgrade_rollback.py \
            --previous-archive "$RUNNER_TEMP/previous/metrum-ai-router-${PREVIOUS_TAG}-linux-amd64.tar.gz" \
            --candidate-archive "dist/metrum-ai-router-${CANDIDATE_TAG}-linux-amd64.tar.gz" \
            --previous-version "$PREVIOUS_TAG" --candidate-version "$CANDIDATE_TAG" \
            --candidate-commit "$CANDIDATE_COMMIT" --service-user "$SERVICE_USER" \
            --report "$RUNNER_TEMP/upgrade-rollback-results.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-upgrade-rollback
          path: ${{ runner.temp }}/upgrade-rollback-results.json
          if-no-files-found: error
          retention-days: 7

  ai-release-review:
    needs: resolve
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ${{ vars.ROUTER_HEAVY_RUNNER || 'router-arc' }}
    timeout-minutes: 45
    permissions:
      actions: read
      checks: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.commit }}
          fetch-depth: 0
      - name: Validate the committed release review artifact
        env:
          GH_TOKEN: ${{ github.token }}
          REVIEW_BASE: ${{ needs.resolve.outputs.previous_tag }}
          REVIEW_BASE_COMMIT: ${{ needs.resolve.outputs.previous_commit }}
          REVIEW_HEAD: ${{ needs.resolve.outputs.commit }}
          RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/review-output"
          python3 scripts/release_ai_review.py \
            --base "${REVIEW_BASE}" \
            --base-commit "${REVIEW_BASE_COMMIT}" \
            --head "${REVIEW_HEAD}" \
            --tag "${RELEASE_TAG}" \
            --responses docs/release-review-responses.json \
            --committed-artifact-dir docs/release-reviews \
            --artifact-output "${RUNNER_TEMP}/review-output/review.json" \
            --output "${RUNNER_TEMP}/review-output/AI-release-review.md"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: release-ai-review
          path: |
            ${{ runner.temp }}/review-output/AI-release-review.md
            ${{ runner.temp }}/review-output/review.json
          if-no-files-found: warn
          retention-days: 14

  publish-release:
    needs: [resolve, package-binaries, reproducible-build, ai-release-review, upgrade-and-rollback]
    if: >-
      always() && startsWith(github.ref, 'refs/tags/') &&
      needs.resolve.result == 'success' &&
      needs.package-binaries.result == 'success' &&
      needs.reproducible-build.result == 'success' &&
      needs.ai-release-review.result == 'success'
      && needs.upgrade-and-rollback.result == 'success'
    runs-on: ${{ vars.ROUTER_HEAVY_RUNNER || 'router-arc' }}
    timeout-minutes: 60
    environment: release
    permissions:
      actions: read
      attestations: write
      contents: write
      deployments: read
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.resolve.outputs.tag }}
      COMMIT: ${{ needs.resolve.outputs.commit }}
      BUILD_DATE: ${{ needs.resolve.outputs.build_date }}
      SOURCE_DATE_EPOCH: ${{ needs.resolve.outputs.source_date_epoch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.commit }}
          fetch-depth: 0
      - name: Install pinned GitHub CLI
        run: bash scripts/install_github_cli.sh "${RUNNER_TEMP}/gh-cli/bin"
      - name: Provide envsubst for Cosign installer
        run: |
          set -euo pipefail
          if command -v envsubst >/dev/null 2>&1; then
            exit 0
          fi
          shim_dir="${RUNNER_TEMP}/cosign-envsubst-bin"
          mkdir -p "${shim_dir}"
          cp scripts/envsubst_compat.py "${shim_dir}/envsubst"
          chmod 0755 "${shim_dir}/envsubst"
          printf '%s\n' "${shim_dir}" >> "${GITHUB_PATH}"
      - name: Install pinned Cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: v3.1.4
          install-dir: ${{ runner.temp }}/cosign-bin
      - name: Verify Cosign installation
        run: cosign version
      - name: Install pinned Syft
        id: syft
        uses: anchore/sbom-action/download-syft@d8a2c0130026bf585de5c176ab8f7ce62d75bf04 # v0.20.7
        with:
          syft-version: v1.57.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Set up pinned Java for jsign
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - name: Fetch pinned jsign (checksum-verified)
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/signing"
          curl -fsSL -o "${RUNNER_TEMP}/signing/jsign.jar" https://github.com/ebourg/jsign/releases/download/7.6/jsign-7.6.jar
          jsign_sha256="$(PYTHONPATH=scripts python3 -c 'from release_publish_tool_contract import JSIGN_SHA256; print(JSIGN_SHA256)')"
          printf '%s  %s\n' "${jsign_sha256}" "${RUNNER_TEMP}/signing/jsign.jar" | sha256sum -c -
      - name: Publish tool contract
        env:
          JSIGN_JAR: ${{ runner.temp }}/signing/jsign.jar
          SYFT_COMMAND: ${{ steps.syft.outputs.cmd }}
        run: python3 scripts/release_publish_tool_contract.py --gh "${RUNNER_TEMP}/gh-cli/bin/gh" --syft "${SYFT_COMMAND}" --jsign-jar "${JSIGN_JAR}"
      - name: Verify release environment protection before publish
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/environments/release" > "${RUNNER_TEMP}/release-environment.json"
          gh api "repos/${GITHUB_REPOSITORY}/environments/release/deployment-branch-policies" > "${RUNNER_TEMP}/release-policies.json"
          python3 scripts/check_release_environment.py "${RUNNER_TEMP}/release-environment.json" "${RUNNER_TEMP}/release-policies.json"
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: release-binaries
          path: dist
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: release-engine-advisories
          path: ${{ runner.temp }}/advisory-snapshot
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: release-ai-review
          path: ${{ runner.temp }}/release-review
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: release-upgrade-rollback
          path: dist
      - name: Stage exact unsigned release payload
        run: python3 scripts/stage_release_payload.py --source dist --destination "${RUNNER_TEMP}/unsigned-payload" --version "${VERSION}"
      - name: Validate exact unsigned release payload
        run: python3 scripts/check_release_payload.py --stage unsigned --dist-dir "${RUNNER_TEMP}/unsigned-payload" --version "${VERSION}"
      - name: Sign Windows release packages after reproducibility comparison
        env:
          JSIGN_JAR: ${{ runner.temp }}/signing/jsign.jar
          ROUTER_SIGN_WINDOWS: '1'
          ROUTER_REQUIRE_WINDOWS_SIGNING: ${{ vars.WINDOWS_SIGNING_REQUIRED == 'true' && '1' || '' }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          TRUSTED_SIGNING_ENDPOINT: ${{ secrets.TRUSTED_SIGNING_ENDPOINT }}
          TRUSTED_SIGNING_ACCOUNT: ${{ secrets.TRUSTED_SIGNING_ACCOUNT }}
          TRUSTED_SIGNING_CERT_PROFILE: ${{ secrets.TRUSTED_SIGNING_CERT_PROFILE }}
        run: python3 scripts/sign_release_windows_packages.py --dist-dir dist --version "${VERSION}"
      - name: Verify successful AI review artifact
        run: |
          set -euo pipefail
          test -s "${RUNNER_TEMP}/release-review/AI-release-review.md"
          test -s "${RUNNER_TEMP}/release-review/review.json"
          rg -q '^\- Decision: \*\*PASS\*\*$' "${RUNNER_TEMP}/release-review/AI-release-review.md"
          cp "${RUNNER_TEMP}/release-review/AI-release-review.md" dist/AI-release-review.md
          cp "${RUNNER_TEMP}/release-review/review.json" dist/release-review-artifact.json
      - name: Validate binary inventory
        env:
          ENGINE_ADVISORY_SNAPSHOT: ${{ runner.temp }}/advisory-snapshot/engine-advisories.json
        run: python3 scripts/release_artifact_inventory.py --dist-dir dist --version "${VERSION}" --commit "${COMMIT}" --build-date "${BUILD_DATE}" --set binary --advisories-snapshot
      - name: Generate SPDX SBOM for each release archive
        env:
          SYFT_COMMAND: ${{ steps.syft.outputs.cmd }}
        run: python3 scripts/generate_release_spdx.py --dist-dir dist --version "${VERSION}" --output-dir dist --syft "${SYFT_COMMAND}" --artifact-set binary
      - name: Sign and verify SPDX SBOM assets
        run: |
          set -euo pipefail
          identity="https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@refs/tags/${VERSION}"
          shopt -s nullglob
          sboms=(dist/*.spdx.json)
          test "${#sboms[@]}" -eq 4
          for sbom in "${sboms[@]}"; do
            cosign sign-blob --yes --bundle "${sbom}.sigstore.json" "${sbom}" >/dev/null
            cosign verify-blob --bundle "${sbom}.sigstore.json" \
              --certificate-identity "${identity}" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com "${sbom}" >/dev/null
          done
      - name: Sign release archives with Cosign
        run: |
          set -euo pipefail
          shopt -s nullglob
          assets=(dist/metrum-ai-router-"${VERSION}"-*.tar.gz dist/metrum-ai-router-"${VERSION}"-*.zip)
          test "${#assets[@]}" -eq 4
          identity="https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@refs/tags/${VERSION}"
          for asset in "${assets[@]}"; do
            cosign sign-blob --yes --bundle "${asset}.sigstore.json" "${asset}" >/dev/null
            cosign verify-blob --bundle "${asset}.sigstore.json" --certificate-identity "$identity" --certificate-oidc-issuer https://token.actions.githubusercontent.com "${asset}" >/dev/null
          done
      - name: Attest release archives
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/metrum-ai-router-*.tar.gz
            dist/metrum-ai-router-*.zip
            dist/upgrade-rollback-results.json
            dist/SHA256SUMS
            dist/release-artifacts.json
            dist/AI-release-review.md
            dist/release-review-artifact.json
      - name: Verify attestations and require complete payload
        run: |
          set -euo pipefail
          for asset in dist/metrum-ai-router-"${VERSION}"-*.tar.gz dist/metrum-ai-router-"${VERSION}"-*.zip dist/upgrade-rollback-results.json dist/SHA256SUMS dist/release-artifacts.json; do
            gh attestation verify "$asset" --repo "${GITHUB_REPOSITORY}" \
              --signer-workflow "github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml" \
              --source-ref "refs/tags/${VERSION}" >/dev/null
          done
          for asset in dist/AI-release-review.md dist/release-review-artifact.json; do
            gh attestation verify "${asset}" --repo "${GITHUB_REPOSITORY}" \
              --signer-workflow "github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml" \
              --source-ref "refs/tags/${VERSION}" >/dev/null
          done
          python3 scripts/check_release_payload.py --dist-dir dist --version "${VERSION}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signed-release-assets
          path: |
            dist/metrum-ai-router-*
            dist/SHA256SUMS
            dist/release-artifacts.json
            dist/release-review-artifact.json
            dist/upgrade-rollback-results.json
            dist/AI-release-review.md
          if-no-files-found: error
          retention-days: 7
      - name: Confirm payload and publish immutable release
        run: |
          set -euo pipefail
          mapfile -t ASSETS < <(find dist -maxdepth 1 -type f             \( -name 'metrum-ai-router-*' -o -name upgrade-rollback-results.json -o -name AI-release-review.md -o -name release-review-artifact.json -o -name SHA256SUMS -o -name release-artifacts.json \) | sort)
          test "${#ASSETS[@]}" -eq 21
          if gh release view "${VERSION}" >/dev/null 2>&1; then echo "GitHub Release ${VERSION} already exists; releases are immutable" >&2; exit 1; fi
          NOTES_FILE="${RUNNER_TEMP}/release-notes.md"
          git tag -l --format='%(contents)' "${VERSION}" > "$NOTES_FILE"
          if [ ! -s "$NOTES_FILE" ]; then printf 'Metrum AI Router %s\n' "${VERSION}" > "$NOTES_FILE"; fi
          python3 scripts/publish_github_release.py \
            --version "${VERSION}" \
            --title "Metrum AI Router ${VERSION}" \
            --notes-file "$NOTES_FILE" \
            "${ASSETS[@]}"

name: Release artifacts

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build (for example v2.0.0). Build-only unless this run is already on that tag ref."
        required: true

permissions:
  contents: read

jobs:
  package:
    runs-on: router-arc
    timeout-minutes: 90
    permissions:
      # Only this job creates the GitHub Release; the workflow needs no
      # id-token or packages grants.
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Resolve version
        id: version
        env:
          RELEASE_EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG_INPUT: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [ "${RELEASE_EVENT_NAME}" = "workflow_dispatch" ]; then
            candidate="${RELEASE_TAG_INPUT}"
          else
            candidate="${GITHUB_REF_NAME}"
          fi
          # Strict v<semver> validation before the value can influence any
          # later shell step or output.
          tag="$(python3 scripts/validate_release_tag.py "${candidate}")"
          printf 'tag=%s\n' "${tag}" >> "${GITHUB_OUTPUT}"
      # Authenticode signing (#332) is enabled only for real tag builds. The
      # pinned, checksum-verified jsign fat jar is fetched only then. When the
      # Trusted Signing secrets are absent the sign step is a logged no-op, so
      # this workflow keeps working until the credentials are provisioned.
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        if: startsWith(github.ref, 'refs/tags/')
        with:
          distribution: temurin
          java-version: '21'
      - name: Fetch pinned jsign (checksum-verified)
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/signing"
          curl -fsSL -o "${RUNNER_TEMP}/signing/jsign.jar" https://github.com/ebourg/jsign/releases/download/7.6/jsign-7.6.jar
          echo "6cf58aa080e7ff82656f320cff8d4a3bff30408df8766806dcba3740dd839fa5  ${RUNNER_TEMP}/signing/jsign.jar" | sha256sum -c -
      - name: Build packages
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          JSIGN_JAR: ${{ runner.temp }}/signing/jsign.jar
          ROUTER_SIGN_WINDOWS: ${{ startsWith(github.ref, 'refs/tags/') && '1' || '' }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          TRUSTED_SIGNING_ENDPOINT: ${{ secrets.TRUSTED_SIGNING_ENDPOINT }}
          TRUSTED_SIGNING_ACCOUNT: ${{ secrets.TRUSTED_SIGNING_ACCOUNT }}
          TRUSTED_SIGNING_CERT_PROFILE: ${{ secrets.TRUSTED_SIGNING_CERT_PROFILE }}
        run: |
          # Binary packages only: the ephemeral router-arc pods have no
          # Docker daemon (and must not mount the host socket). Build customer
          # Docker packages on a Docker-capable host with `make package-docker`.
          export VERSION="${RELEASE_TAG}"
          make package
      - name: Inventory and checksums
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          python3 scripts/release_artifact_inventory.py \
            --dist-dir dist \
            --version "${RELEASE_TAG}" \
            --commit "$(git rev-parse HEAD)" \
            --build-date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --set binary
      - name: Upload inventory-validated release assets
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: metrum-ai-router-${{ steps.version.outputs.tag }}
          path: |
            dist/metrum-ai-router-*.tar.gz
            dist/metrum-ai-router-*.zip
            dist/SHA256SUMS
            dist/release-artifacts.json
          if-no-files-found: error
      - name: Publish GitHub Release with assets
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          TAG="${RELEASE_TAG}"
          if [ "${GITHUB_REF_NAME}" != "${TAG}" ]; then
            echo "ref tag ${GITHUB_REF_NAME} does not match resolved version ${TAG}" >&2
            exit 2
          fi
          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "GitHub Release ${TAG} already exists." >&2
            echo "This repository uses immutable releases, so assets cannot be uploaded after the fact." >&2
            echo "Do not create an empty release first. Push the annotated tag and let this workflow create the release with inventory-validated assets in one step." >&2
            exit 1
          fi
          mapfile -t ASSETS < <(
            {
              find dist -maxdepth 1 -type f \( -name 'metrum-ai-router-*.tar.gz' -o -name 'metrum-ai-router-*.zip' \)
              printf '%s\n' dist/SHA256SUMS dist/release-artifacts.json
            } | sort -u
          )
          if [ "${#ASSETS[@]}" -eq 0 ]; then
            echo "no inventory-validated dist assets found to attach to ${TAG}" >&2
            exit 1
          fi
          for asset in "${ASSETS[@]}"; do
            if [ ! -f "${asset}" ]; then
              echo "missing required release asset: ${asset}" >&2
              exit 1
            fi
          done
          NOTES_FILE="$(mktemp)"
          if git cat-file -t "refs/tags/${TAG}" 2>/dev/null | grep -qx tag; then
            git tag -l --format='%(contents)' "${TAG}" > "${NOTES_FILE}"
          fi
          if [ ! -s "${NOTES_FILE}" ]; then
            printf 'Metrum AI Router %s\n' "${TAG}" > "${NOTES_FILE}"
          fi
          # Dry-run the exact publication command shape before mutate.
          printf 'gh release create %s --verify-tag --title %s --notes-file %s' "${TAG}" "Metrum AI Router ${TAG}" "${NOTES_FILE}"
          printf ' %q' "${ASSETS[@]}"
          printf '\n'
          gh release create "${TAG}" \
            --verify-tag \
            --title "Metrum AI Router ${TAG}" \
            --notes-file "${NOTES_FILE}" \
            "${ASSETS[@]}"

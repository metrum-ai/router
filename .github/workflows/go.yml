name: Go

on:
  pull_request:
  merge_group:
  workflow_dispatch:

# merge_group reports this required check without repeating test-fast.
# The combined SHA runs test-fast inside the deterministic gate.
concurrency:
  group: go-${{ github.workflow }}-${{ github.ref }}
  # Keep pull-request cancellation; never cancel a merge-group gate mid-flight.
  cancel-in-progress: ${{ github.event_name != 'merge_group' }}

permissions:
  contents: read

jobs:
  # Separate merge-group job so GitHub does not download setup-go/python while
  # reporting the required check name. Action downloads have failed on runner DNS.
  test-and-vet:
    if: github.event_name != 'merge_group'
    runs-on: [self-hosted, Linux, X64, router]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "gofmt needed on:" >&2
            echo "$unformatted" >&2
            exit 1
          fi
      - name: go vet
        run: go vet ./...
      - name: make test-fast
        run: make test-fast

  test-and-vet-merge-group:
    if: github.event_name == 'merge_group'
    name: test-and-vet
    runs-on: [self-hosted, Linux, X64, router]
    timeout-minutes: 5
    steps:
      - name: Covered by merge-group test-full
        run: echo "make test-fast runs inside the merge-group test-full job"

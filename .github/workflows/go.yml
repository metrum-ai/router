name: Go

on:
  pull_request:
  merge_group:
  workflow_dispatch:

# merge_group reports this required check without repeating test-fast.
# The combined SHA runs test-fast inside the deterministic gate.
concurrency:
  group: go-${{ github.workflow }}-${{ github.ref }}
  # Keep pull-request cancellation; never cancel a merge-group gate mid-flight.
  cancel-in-progress: ${{ github.event_name != 'merge_group' }}

permissions:
  contents: read

jobs:
  # Separate merge-group job so GitHub does not download setup-go/python while
  # reporting the required check name. Action downloads have failed on runner DNS.
  test-and-vet:
    if: github.event_name != 'merge_group'
    runs-on: router-arc
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "gofmt needed on:" >&2
            echo "$unformatted" >&2
            exit 1
          fi
      - name: go vet
        run: go vet ./...
      - name: make test-fast
        run: make test-fast

  windows-cross-compile:
    if: github.event_name != 'merge_group'
    runs-on: router-arc
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: go vet (windows/${{ matrix.arch }})
        env:
          CGO_ENABLED: 0
          GOOS: windows
          GOARCH: ${{ matrix.arch }}
        run: go vet ./...
      - name: cross-compile release binaries (windows/${{ matrix.arch }})
        env:
          CGO_ENABLED: 0
          GOOS: windows
          GOARCH: ${{ matrix.arch }}
        run: |
          set -eu
          for bin in $(make -s --eval='print-package-binaries:;@echo $(PACKAGE_BINARIES)' print-package-binaries); do
            go build -buildvcs=false -o "$RUNNER_TEMP/$bin.exe" "./cmd/$bin"
          done

  test-and-vet-merge-group:
    if: github.event_name == 'merge_group'
    name: test-and-vet
    runs-on: router-arc
    timeout-minutes: 5
    steps:
      - name: Covered by merge-group test-full
        run: echo "make test-fast runs inside the merge-group test-full job"

name: Source headers

on:
  pull_request:
  merge_group:
  push:
    branches: [main]

concurrency:
  group: source-headers-${{ github.workflow }}-${{ github.ref }}
  # Keep pull-request cancellation; never cancel a merge-group gate mid-flight.
  cancel-in-progress: ${{ github.event_name != 'merge_group' }}

permissions:
  contents: read

jobs:
  validate:
    runs-on: [self-hosted, Linux, X64, router]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - run: python3 scripts/check_source_headers.py

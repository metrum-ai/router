name: Source headers

on:
  pull_request:
  merge_group:
  push:
    branches: [main]

concurrency:
  group: source-headers-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: [self-hosted, Linux, X64, router]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - run: python3 scripts/check_source_headers.py

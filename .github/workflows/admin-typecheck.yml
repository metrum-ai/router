name: Admin typecheck

on:
  pull_request:
    paths:
      - "internal/router/admindist/web/**"
      - ".github/workflows/admin-typecheck.yml"
  workflow_dispatch:

concurrency:
  group: admin-typecheck-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  admin-typecheck:
    runs-on: [self-hosted, Linux, X64, router]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: internal/router/admindist/web/package-lock.json
      - name: admin typecheck
        run: |
          npm ci --prefix internal/router/admindist/web --no-audit --no-fund
          npx --prefix internal/router/admindist/web tsc --noEmit -p internal/router/admindist/web

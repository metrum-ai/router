name: Fine-tuning example
on:
  pull_request:
  merge_group:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ft-example-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'merge_group' }}
jobs:
  offline:
    runs-on: router-arc
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: examples/fine-tune-qwen3p8-27b/eval/package-lock.json
      - run: make ft-example-test
      - name: Run 3 source and split freeze
        run: uv run --with bcrypt --with jsonschema==4.26.0 python -m unittest discover -s examples/fine-tune-qwen3p8-27b/run3 -p 'test_*.py' -v
      - name: Synthetic router tool continuation
        run: |
          go build -o "$RUNNER_TEMP/ft-example-router" ./cmd/metrum-ai-router
          uv run --with pyyaml --with jsonschema==4.26.0 python examples/fine-tune-qwen3p8-27b/eval/router_e2e.py --router-bin "$RUNNER_TEMP/ft-example-router"

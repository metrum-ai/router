name: Fine-tuning example
on:
  pull_request:
    paths:
      - 'examples/fine-tune-qwen3p8-27b/**'
      - 'examples/catalog/**'
      - '**/*.go'
      - 'cmd/**'
      - 'internal/**'
      - 'testdata/**'
      - 'env*.json'
      - 'go.mod'
      - 'go.sum'
      - 'config/**'
      - 'config*.yaml'
      - 'scripts/**'
      - 'Makefile'
      - '.github/workflows/ft-example.yml'
  merge_group:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ft-example-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'merge_group' }}
jobs:
  offline:
    runs-on: router-arc-small
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Select merge-group lanes
        if: github.event_name == 'merge_group'
        env:
          CI_BASE_SHA: ${{ github.event.merge_group.base_sha }}
        run: python3 scripts/ci_changes.py
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: github.event_name != 'merge_group' || env.CI_RUN_GO == '1' || env.CI_RUN_EXAMPLES == '1'
        with:
          go-version-file: go.mod
          cache: true
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        if: github.event_name != 'merge_group' || env.CI_RUN_GO == '1' || env.CI_RUN_EXAMPLES == '1'
        with:
          enable-cache: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: github.event_name != 'merge_group' || env.CI_RUN_GO == '1' || env.CI_RUN_EXAMPLES == '1'
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: examples/fine-tune-qwen3p8-27b/eval/package-lock.json
      - run: make ft-example-test
        if: github.event_name != 'merge_group' || env.CI_RUN_GO == '1' || env.CI_RUN_EXAMPLES == '1'
      - name: Run 3 source, split and mock collection
        if: github.event_name != 'merge_group' || env.CI_RUN_GO == '1' || env.CI_RUN_EXAMPLES == '1'
        run: |
          go build -o "$RUNNER_TEMP/ft-example-router" ./cmd/metrum-ai-router
          ROUTER_TEST_BINARY="$RUNNER_TEMP/ft-example-router" uv run --with bcrypt --with jsonschema==4.26.0 python -m unittest discover -s examples/fine-tune-qwen3p8-27b/run3 -p 'test_*.py' -v
      - name: Synthetic router tool continuation
        if: github.event_name != 'merge_group' || env.CI_RUN_GO == '1' || env.CI_RUN_EXAMPLES == '1'
        run: |
          uv run --with pyyaml --with jsonschema==4.26.0 python examples/fine-tune-qwen3p8-27b/eval/router_e2e.py --router-bin "$RUNNER_TEMP/ft-example-router"

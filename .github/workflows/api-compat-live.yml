name: API compatibility live status

# Pull requests run the credential-free contract only. Provider calls stay on
# a manual dispatch in the protected evaluation environment and fail closed.

on:
  pull_request:
    paths:
      - "Makefile"
      - "scripts/api_compat_live.py"
      - "scripts/api_compat_live_test.py"
      - "tests/api_compat/testdata/live/**"
      - "docs-site/docs/reference/api-compatibility.md"
      - ".github/workflows/api-compat-live.yml"
  workflow_dispatch:
    inputs:
      matrix:
        description: "Approved non-production matrix id"
        required: true
      environment:
        description: "Non-production environment name"
        required: true
      caller:
        description: "Least-privilege caller name"
        required: true
      confirm:
        description: "Must equal matrix:environment"
        required: true

concurrency:
  group: api-compat-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  live-unit:
    runs-on: [self-hosted, Linux, X64, router]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Credential-free live runner contracts
        run: python3 scripts/api_compat_live_test.py

  live:
    needs: live-unit
    if: github.event_name == 'workflow_dispatch' && needs.live-unit.result == 'success'
    runs-on: [self-hosted, Linux, X64, router]
    environment: evaluation
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Run bounded non-production matrix
        env:
          API_COMPAT_LIVE_CREDENTIAL: ${{ secrets.API_COMPAT_LIVE_CREDENTIAL }}
          API_COMPAT_LIVE_BASE_URL: ${{ secrets.API_COMPAT_LIVE_BASE_URL }}
          API_COMPAT_LIVE_MATRIX: ${{ inputs.matrix }}
          API_COMPAT_LIVE_ENVIRONMENT: ${{ inputs.environment }}
          API_COMPAT_LIVE_CALLER: ${{ inputs.caller }}
          API_COMPAT_LIVE_CONFIRM: ${{ inputs.confirm }}
        run: |
          set -euo pipefail
          cred_file="$(python3 - <<'PY'
          import os
          import tempfile
          raw = os.environ.get("API_COMPAT_LIVE_CREDENTIAL", "")
          handle = tempfile.NamedTemporaryFile(prefix="api-compat-cred-", delete=False)
          handle.write(raw.encode())
          handle.close()
          os.chmod(handle.name, 0o600)
          print(handle.name)
          PY
          )"
          export API_COMPAT_LIVE_CREDENTIAL_FILE="$cred_file"
          unset API_COMPAT_LIVE_CREDENTIAL
          make api-compat-live

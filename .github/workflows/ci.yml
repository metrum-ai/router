name: ci
on:
  pull_request:
  merge_group:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'merge_group' }}

jobs:
  router:
    name: router (${{ matrix.shard }})
    if: github.event_name != 'push'
    runs-on: router-arc
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5]
    steps:
      - name: Isolate job caches
        run: |
          echo "GOCACHE=$RUNNER_TEMP/router-go-build" >> "$GITHUB_ENV"
          echo "GOMODCACHE=$RUNNER_TEMP/router-go-mod" >> "$GITHUB_ENV"
          echo "COMPAT_CACHE=$RUNNER_TEMP/router-compat" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Select optional lanes
        env:
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || '' }}
        run: python3 scripts/ci_changes.py
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: env.CI_RUN_GO == '1'
        with:
          go-version-file: go.mod
          cache: false
      - name: Locate Go caches
        if: env.CI_RUN_GO == '1'
        id: go-paths
        run: |
          echo "build=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"
          echo "modules=$(go env GOMODCACHE)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        if: env.CI_RUN_GO == '1'
        with:
          path: |
            ${{ steps.go-paths.outputs.build }}
            ${{ steps.go-paths.outputs.modules }}
          key: ci-go-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('go.mod', 'go.sum') }}-${{ github.sha }}
          restore-keys: |
            ci-go-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('go.mod', 'go.sum') }}-
      - name: Router shard
        if: env.CI_RUN_GO == '1'
        run: env -u AWS_BEARER_TOKEN_BEDROCK python3 scripts/ci_router_shards.py --shard-count 6 --shard-index ${{ matrix.shard }}

  other-go:
    name: Other Go and Windows
    if: github.event_name != 'push'
    runs-on: router-arc
    timeout-minutes: 45
    steps:
      - name: Isolate job caches
        run: |
          echo "GOCACHE=$RUNNER_TEMP/router-go-build" >> "$GITHUB_ENV"
          echo "GOMODCACHE=$RUNNER_TEMP/router-go-mod" >> "$GITHUB_ENV"
          echo "COMPAT_CACHE=$RUNNER_TEMP/router-compat" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Select optional lanes
        env:
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || '' }}
        run: python3 scripts/ci_changes.py
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: env.CI_RUN_GO == '1'
        with:
          go-version-file: go.mod
          cache: false
      - name: Locate Go caches
        if: env.CI_RUN_GO == '1'
        id: go-paths
        run: |
          echo "build=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"
          echo "modules=$(go env GOMODCACHE)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        if: env.CI_RUN_GO == '1'
        with:
          path: |
            ${{ steps.go-paths.outputs.build }}
            ${{ steps.go-paths.outputs.modules }}
          key: ci-go-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('go.mod', 'go.sum') }}-${{ github.sha }}
          restore-keys: |
            ci-go-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('go.mod', 'go.sum') }}-
      - name: Other Go and Windows
        if: env.CI_RUN_GO == '1'
        run: env -u AWS_BEARER_TOKEN_BEDROCK make -k -j2 ci-go ci-windows

  other:
    name: Compatibility, Python and examples
    if: github.event_name != 'push'
    runs-on: router-arc
    timeout-minutes: 45
    steps:
      - name: Isolate job caches
        run: |
          echo "GOCACHE=$RUNNER_TEMP/router-go-build" >> "$GITHUB_ENV"
          echo "GOMODCACHE=$RUNNER_TEMP/router-go-mod" >> "$GITHUB_ENV"
          echo "COMPAT_CACHE=$RUNNER_TEMP/router-compat" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Select optional lanes
        env:
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || '' }}
        run: python3 scripts/ci_changes.py
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Locate Go caches
        id: go-paths
        run: |
          echo "build=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"
          echo "modules=$(go env GOMODCACHE)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ${{ steps.go-paths.outputs.build }}
            ${{ steps.go-paths.outputs.modules }}
          key: ci-go-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('go.mod', 'go.sum') }}-${{ github.sha }}
          restore-keys: |
            ci-go-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('go.mod', 'go.sum') }}-
      - name: Read pinned tester commits
        id: pins
        run: python3 scripts/ci_tester_pins.py >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ env.COMPAT_CACHE }}
          key: ci-testers-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('go.mod') }}-${{ steps.pins.outputs.openai }}-${{ steps.pins.outputs.anthropic }}
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
      - name: Compatibility, Python and optional examples
        run: |
          lanes=(ci-python compat-mock)
          if [ "$CI_RUN_EXAMPLES" = 1 ]; then lanes+=(ci-examples); fi
          env -u AWS_BEARER_TOKEN_BEDROCK make -k -j3 "${lanes[@]}"

  warm:
    name: Warm main caches
    if: github.event_name == 'push'
    runs-on: router-arc
    timeout-minutes: 45
    steps:
      - name: Isolate job caches
        run: |
          echo "GOCACHE=$RUNNER_TEMP/router-go-build" >> "$GITHUB_ENV"
          echo "GOMODCACHE=$RUNNER_TEMP/router-go-mod" >> "$GITHUB_ENV"
          echo "COMPAT_CACHE=$RUNNER_TEMP/router-compat" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Select optional lanes
        env:
          CI_BASE_SHA: ${{ github.event.before }}
        run: python3 scripts/ci_changes.py
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Locate Go caches
        id: go-paths
        run: |
          echo "build=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"
          echo "modules=$(go env GOMODCACHE)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        id: go-cache
        if: env.CI_RUN_GO == '1'
        with:
          path: |
            ${{ steps.go-paths.outputs.build }}
            ${{ steps.go-paths.outputs.modules }}
          key: ci-go-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('go.mod', 'go.sum') }}-${{ github.sha }}
          restore-keys: |
            ci-go-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('go.mod', 'go.sum') }}-
      - name: Warm Go builds and test results
        if: env.CI_RUN_GO == '1'
        run: |
          env -u AWS_BEARER_TOKEN_BEDROCK make -k -j2 ci-go ci-windows
          for shard in 0 1 2 3 4 5; do
            env -u AWS_BEARER_TOKEN_BEDROCK python3 scripts/ci_router_shards.py --shard-count 6 --shard-index "$shard"
          done
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        if: env.CI_RUN_GO == '1' && steps.go-cache.outputs.cache-hit != 'true'
        with:
          path: |
            ${{ steps.go-paths.outputs.build }}
            ${{ steps.go-paths.outputs.modules }}
          key: ci-go-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('go.mod', 'go.sum') }}-${{ github.sha }}
      - name: Read pinned tester commits
        id: pins
        run: python3 scripts/ci_tester_pins.py >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        id: tester-cache
        with:
          path: ${{ env.COMPAT_CACHE }}
          key: ci-testers-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('go.mod') }}-${{ steps.pins.outputs.openai }}-${{ steps.pins.outputs.anthropic }}
      - name: Build pinned testers
        run: |
          python3 -c 'import sys; sys.path.insert(0, "scripts"); from compat_mock import TESTERS, build_tester; [build_tester(k, v[0]) for k, v in TESTERS.items()]'
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        if: steps.tester-cache.outputs.cache-hit != 'true'
        with:
          path: ${{ env.COMPAT_CACHE }}
          key: ci-testers-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('go.mod') }}-${{ steps.pins.outputs.openai }}-${{ steps.pins.outputs.anthropic }}

  ci:
    name: ci
    runs-on: router-arc
    if: always()
    needs: [router, other-go, other, warm]
    timeout-minutes: 5
    steps:
      - name: Require every lane
        env:
          CI_EVENT: ${{ github.event_name }}
          ROUTER_RESULT: ${{ needs.router.result }}
          OTHER_GO_RESULT: ${{ needs.other-go.result }}
          OTHER_RESULT: ${{ needs.other.result }}
          WARM_RESULT: ${{ needs.warm.result }}
        run: |
          if [ "$CI_EVENT" = push ]; then
            [ "$WARM_RESULT" = success ] || { echo "Main cache warm failed: $WARM_RESULT" >&2; exit 1; }
            for result in "$ROUTER_RESULT" "$OTHER_GO_RESULT" "$OTHER_RESULT"; do
              [ "$result" = skipped ] || { echo "Unexpected push lane result: $result" >&2; exit 1; }
            done
          else
            [ "$WARM_RESULT" = skipped ] || { echo "Unexpected cache warm result: $WARM_RESULT" >&2; exit 1; }
            for result in "$ROUTER_RESULT" "$OTHER_GO_RESULT" "$OTHER_RESULT"; do
              [ "$result" = success ] || { echo "A required CI lane did not succeed: $result" >&2; exit 1; }
            done
          fi

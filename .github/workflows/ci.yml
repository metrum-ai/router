name: ci
on:
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'merge_group' }}

jobs:
  router:
    name: router (${{ matrix.shard }})
    runs-on: router-arc
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Select optional lanes
        env:
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || '' }}
        run: python3 scripts/ci_changes.py
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: env.CI_RUN_GO == '1'
        with:
          go-version-file: go.mod
          cache: true
      - name: Router shard
        if: env.CI_RUN_GO == '1'
        run: env -u AWS_BEARER_TOKEN_BEDROCK python3 scripts/ci_router_shards.py --shard-count 6 --shard-index ${{ matrix.shard }}

  other-go:
    name: Other Go and Windows
    runs-on: router-arc
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Select optional lanes
        env:
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || '' }}
        run: python3 scripts/ci_changes.py
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: env.CI_RUN_GO == '1'
        with:
          go-version-file: go.mod
          cache: true
      - name: Other Go and Windows
        if: env.CI_RUN_GO == '1'
        run: env -u AWS_BEARER_TOKEN_BEDROCK make -k -j2 ci-go ci-windows

  other:
    name: Compatibility, Python and examples
    runs-on: router-arc
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Select optional lanes
        env:
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || '' }}
        run: python3 scripts/ci_changes.py
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: tests/agent_compat/package-lock.json
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cache/router-compat
            ~/.cache/pip
          key: compat-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/compat_mock.py', 'go.mod') }}
      - name: Compatibility, Python and optional examples
        run: |
          lanes=(ci-python compat-mock)
          if [ "$CI_RUN_EXAMPLES" = 1 ]; then lanes+=(ci-examples); fi
          env -u AWS_BEARER_TOKEN_BEDROCK make -k -j3 "${lanes[@]}"

  # Required on the combined merge-group SHA and on manual dispatch; PRs
  # intentionally skip this lane to avoid duplicate high-cost scans.
  sbom:
    if: github.event_name != 'pull_request'
    runs-on: router-arc
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Generate CycloneDX source SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c
        with:
          path: .
          format: cyclonedx-json
          output-file: source-sbom.cdx.json
          upload-artifact: true
      - name: Scan source dependencies
        uses: anchore/scan-action@1638637db639e0ade3258b51db49a9a137574c3e
        with:
          path: .
          fail-build: true
          severity-cutoff: high
          output-format: sarif
          output-file: source-vulnerabilities.sarif
      - name: Upload vulnerability report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: source-vulnerabilities-sarif
          path: source-vulnerabilities.sarif
          if-no-files-found: error

  ci:
    name: ci
    runs-on: router-arc-small
    if: always()
    needs: [router, other-go, other, sbom]
    timeout-minutes: 5
    steps:
      - name: Require every lane
        env:
          ROUTER_RESULT: ${{ needs.router.result }}
          OTHER_GO_RESULT: ${{ needs.other-go.result }}
          OTHER_RESULT: ${{ needs.other.result }}
          SBOM_RESULT: ${{ needs.sbom.result }}
          CI_EVENT_NAME: ${{ github.event_name }}
        run: |
          for result in "$ROUTER_RESULT" "$OTHER_GO_RESULT" "$OTHER_RESULT"; do
            if [ "$result" != success ]; then echo "A required CI lane did not succeed: $result" >&2; exit 1; fi
          done
          if [ "$SBOM_RESULT" != success ] && ! { [ "$CI_EVENT_NAME" = pull_request ] && [ "$SBOM_RESULT" = skipped ]; }; then
            echo "Required SBOM scan did not succeed: $SBOM_RESULT ($CI_EVENT_NAME)" >&2
            exit 1
          fi

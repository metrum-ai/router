name: Case study mock smoke
on:
  pull_request:
  merge_group:
  workflow_dispatch:
concurrency:
  group: case-study-smoke-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'merge_group' }}
permissions:
  contents: read
jobs:
  smoke:
    runs-on: router-arc
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install pinned YAML parser
        run: python3 -m pip install 'PyYAML==6.0.3'
      - name: Run offline mock and verifier tests
        run: |
          for dir in common support-agent document-qa; do
            python3 -m unittest discover -s "examples/case-studies/$dir" -p 'test_*.py' -q
          done
          if test -d examples/case-studies/coding-agent; then
            python3 -m unittest discover -s examples/case-studies/coding-agent -p 'test_*.py' -q
          fi

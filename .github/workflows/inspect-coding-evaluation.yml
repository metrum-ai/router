name: Inspect coding evaluation
# Copyright 2026 Metrum AI
# SPDX-License-Identifier: Apache-2.0

on:
  pull_request:
    paths: ["cmd/metrum-ai-router-usage-report/**", "internal/router/**", "config.example.yaml", "Makefile", "scripts/inspect_coding_eval.py", "scripts/inspect_coding_eval_test.py", "config/evaluation-policy.example.json", ".gitignore", "examples/inspect-coding-evaluation.env.example", "docs/INSPECT_CODING_EVALUATIONS.md", "docs-site/docs/evaluation/evaluate-smart-router.md", ".github/workflows/inspect-coding-evaluation.yml"]
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      tier:
        description: "smoke, full, or promotion-review"
        required: true
        default: "smoke"
      model:
        description: "Deployment-approved group or optional baseline"
        required: false
      limit:
        description: "Bounded task limit"
        required: false
        default: "8"

permissions: { contents: read }

jobs:
  smoke:
    if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.tier == 'smoke')
    runs-on: [self-hosted, Linux, X64, router]
    timeout-minutes: 15
    env:
      EVAL_BASE_URL: ${{ secrets.EVAL_ROUTER_BASE_URL }}
      EVAL_API_KEY: ${{ secrets.EVAL_ROUTER_API_KEY }}
      EVAL_MODEL: ${{ vars.EVAL_ROUTER_MODEL }}
      EVAL_USAGE_CONFIG_YAML: ${{ secrets.EVAL_USAGE_CONFIG_YAML }}
      EVAL_USAGE_CALLER_ID: ${{ vars.EVAL_USAGE_CALLER_ID }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - run: python3 scripts/inspect_coding_eval_test.py
      - name: Install Inspect AI
        if: ${{ env.EVAL_BASE_URL != '' && env.EVAL_API_KEY != '' && env.EVAL_MODEL != '' }}
        run: python3 -m pip install 'inspect-ai==0.3.242' 'inspect-evals==0.15.0'
      - name: Authenticated bounded router smoke
        if: ${{ env.EVAL_BASE_URL != '' && env.EVAL_API_KEY != '' && env.EVAL_MODEL != '' }}
        env:
          EVAL_MODEL_KIND: router-group
          EVAL_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}-smoke
          EVAL_LIMIT: "2"
        run: make eval-ci-smoke
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with: { name: inspect-smoke-sanitized, path: tmp/inspect-evals/**/evaluation-summary.*, if-no-files-found: ignore, retention-days: 7 }

  full-or-promotion:
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.tier != 'smoke')
    runs-on: [self-hosted, Linux, X64, router]
    environment: evaluation
    permissions: { contents: read }
    timeout-minutes: 90
    env:
      EVAL_BASE_URL: ${{ secrets.EVAL_ROUTER_BASE_URL }}
      EVAL_API_KEY: ${{ secrets.EVAL_ROUTER_API_KEY }}
      EVAL_MODEL: ${{ inputs.model || vars.EVAL_ROUTER_MODEL }}
      EVAL_BASELINE_HUMANEVAL_JSON: ${{ secrets.EVAL_BASELINE_HUMANEVAL_JSON }}
      EVAL_BASELINE_BIGCODEBENCH_JSON: ${{ secrets.EVAL_BASELINE_BIGCODEBENCH_JSON }}
      EVAL_ROUTER_USAGE_HUMANEVAL_JSON: ${{ secrets.EVAL_ROUTER_USAGE_HUMANEVAL_JSON }}
      EVAL_ROUTER_USAGE_BIGCODEBENCH_JSON: ${{ secrets.EVAL_ROUTER_USAGE_BIGCODEBENCH_JSON }}
      EVAL_USAGE_CONFIG_YAML: ${{ secrets.EVAL_USAGE_CONFIG_YAML }}
      EVAL_USAGE_CALLER_ID: ${{ vars.EVAL_USAGE_CALLER_ID }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Install Inspect AI
        run: python3 -m pip install 'inspect-ai==0.3.242' 'inspect-evals==0.15.0'
      - name: Run deployment-owned full suite
        env:
          EVAL_MODEL_KIND: router-group
          EVAL_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
          EVAL_LIMIT: ${{ inputs.limit || '8' }}
          EVAL_SAVE_CI_REPORT: "true"
          EVAL_CI_REPORT_DIR: docs/evaluation-reports/inspect
          EVAL_CI_REPORT_TIMESTAMP: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          make eval-ci-full
      - name: Upload sanitized evaluation report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: inspect-sanitized-summary
          path: |
            tmp/inspect-evals/**/evaluation-summary.*
            docs/evaluation-reports/inspect/**
          if-no-files-found: ignore
          retention-days: 30

# Promotion-review is a manual protected-environment decision. A completed
# benchmark is evidence, never an automatic target-weight or membership change.
# Reports are uploaded as artifacts; they are not force-pushed to main.

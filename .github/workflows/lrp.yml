name: Learned routing policy
on:
  pull_request:
    paths:
      - 'services/learned-routing-policy/**'
      - 'scripts/run_lrp_*.py'
      - 'scripts/lrp_*.py'
      - 'scripts/ci_lrp_synthetic.sh'
      - '.github/workflows/lrp.yml'
permissions:
  contents: read
concurrency:
  group: lrp-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  synthetic:
    runs-on: [self-hosted, Linux, X64, router]
    timeout-minutes: 25
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
      - name: Synthetic LRP sandbox and evidence
        run: bash scripts/ci_lrp_synthetic.sh
      - name: Attach approved synthetic training and inference evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: lrp-synthetic-evidence
          if-no-files-found: error
          retention-days: 30
          # Explicit projections only: no raw logs, datasets, models or paths.
          path: |
            /var/tmp/metrum-lrp-synthetic-demo/public-training.json
            /var/tmp/metrum-lrp-synthetic-demo/public-training.log
            /var/tmp/metrum-lrp-synthetic-demo/public-inference.json
            /var/tmp/metrum-lrp-synthetic-demo/public-tests.json

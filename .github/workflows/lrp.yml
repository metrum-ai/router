name: Learned routing policy
on:
  pull_request:
    paths:
      - 'services/learned-routing-policy/**'
      - 'scripts/run_lrp_*.py'
      - 'scripts/lrp_*.py'
      - 'scripts/ci_lrp_synthetic.sh'
      - '.github/workflows/lrp.yml'
permissions:
  contents: read
concurrency:
  group: lrp-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  synthetic:
    runs-on: router-arc
    timeout-minutes: 25
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
      - name: Synthetic LRP sandbox and evidence
        run: bash scripts/ci_lrp_synthetic.sh
      - name: Attach approved synthetic training and inference evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lrp-synthetic-evidence
          if-no-files-found: error
          retention-days: 30
          # Explicit projections only: no raw logs, datasets, models or paths.
          path: |
            /var/tmp/metrum-lrp-synthetic-demo/public-training.json
            /var/tmp/metrum-lrp-synthetic-demo/public-training.log
            /var/tmp/metrum-lrp-synthetic-demo/public-inference.json
            /var/tmp/metrum-lrp-synthetic-demo/public-tests.json

name: Learned routing policy
on:
  pull_request:
    paths:
      - 'services/learned-routing-policy/**'
      - 'scripts/run_lrp_*.py'
      - 'scripts/lrp_*.py'
      - 'scripts/ci_lrp_synthetic.sh'
      - '.github/workflows/lrp.yml'
permissions:
  contents: read
concurrency:
  group: lrp-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  synthetic:
    runs-on: [self-hosted, Linux, X64, router]
    timeout-minutes: 25
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - name: Synthetic LRP sandbox and evidence
        run: bash scripts/ci_lrp_synthetic.sh
      - name: Attach approved synthetic training and inference evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lrp-synthetic-evidence
          if-no-files-found: error
          retention-days: 30
          # Explicit projections only: no raw logs, datasets, models or paths.
          path: |
            /var/tmp/metrum-lrp-synthetic-demo/public-training.json
            /var/tmp/metrum-lrp-synthetic-demo/public-training.log
            /var/tmp/metrum-lrp-synthetic-demo/public-inference.json
            /var/tmp/metrum-lrp-synthetic-demo/public-tests.json

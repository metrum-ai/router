name: Docs QA

on:
  pull_request:
    paths:
      - "README.md"
      - "CONTRIBUTING.md"
      - "GOVERNANCE.md"
      - "SUPPORT.md"
      - "SECURITY.md"
      - "TRADEMARKS.md"
      - "docs/**"
      - "docs-site/**"
      - "config.example.yaml"
      - "scripts/check_docs_*.py"
      - "scripts/validate_docs_*.py"
      - ".github/workflows/docs-qa.yml"
  push:
    branches: [main]
    paths:
      - "README.md"
      - "docs/**"
      - "docs-site/**"
      - "config.example.yaml"
      - ".github/workflows/docs-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docs-qa:
    runs-on: [self-hosted, Linux, X64, router]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: docs-site/package-lock.json
      - name: make docs-qa
        run: make docs-qa
      - name: admin typecheck
        run: |
          npm ci --prefix internal/router/admindist/web --no-audit --no-fund
          npx --prefix internal/router/admindist/web tsc --noEmit -p internal/router/admindist/web

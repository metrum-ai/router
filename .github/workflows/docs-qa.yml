name: Docs QA

on:
  pull_request:
    paths:
      - "README.md"
      - "CONTRIBUTING.md"
      - "GOVERNANCE.md"
      - "SUPPORT.md"
      - "SECURITY.md"
      - "TRADEMARKS.md"
      - "docs/**"
      - "docs-site/**"
      - "config.example.yaml"
      - "Makefile"
      - "scripts/check_docs_*.py"
      - "scripts/validate_docs_*.py"
      - "scripts/tool_compat_matrix.py"
      - "scripts/tool_compat_matrix_test.py"
      - "tests/tool_compat/**"
      - ".github/workflows/docs-qa.yml"
  push:
    branches: [main]
    paths:
      - "README.md"
      - "docs/**"
      - "docs-site/**"
      - "config.example.yaml"
      - "Makefile"
      - "scripts/check_docs_*.py"
      - "scripts/validate_docs_*.py"
      - "scripts/tool_compat_matrix.py"
      - "scripts/tool_compat_matrix_test.py"
      - "tests/tool_compat/**"
      - ".github/workflows/docs-qa.yml"
  workflow_dispatch:

concurrency:
  group: docs-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  docs-qa:
    runs-on: ${{ vars.ROUTER_LIGHT_RUNNER || 'router-arc-small' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: make docs-qa
        run: make docs-qa

  # docs-qa checks Markdown, configuration and links with Python and Go, but it
  # never compiles the site. A page can therefore break the MDX build that
  # make docker-image, release packaging and the gate image depend on (#753).
  # This job compiles the site exactly as release packaging does. It runs on the
  # standard ARC pool, not the small one: the small runner was starved and lost
  # communication during the first attempt at this build.
  docs-site-build:
    runs-on: ${{ vars.ROUTER_HEAVY_RUNNER || 'router-arc' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: docs-site/package-lock.json
      - name: npm ci
        working-directory: docs-site
        run: npm ci --no-audit --no-fund
      - name: docusaurus production build
        working-directory: docs-site
        env:
          DOCS_ROUTER_VERSION: ci
          DOCS_ROUTER_BUILD_DATE: "1970-01-01T00:00:00Z"
        run: npm run build

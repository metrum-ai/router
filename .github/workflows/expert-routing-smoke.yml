name: Expert routing benchmark smoke
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'examples/expert-routing-benchmark/**'
      - 'examples/catalog/**'
      - '.github/workflows/expert-routing-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: expert-routing-smoke-${{ github.ref }}
  cancel-in-progress: true
jobs:
  mock:
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    runs-on: ${{ vars.ROUTER_LIGHT_RUNNER || 'router-arc-small' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install pinned host download CLI
        run: python -m pip install 'huggingface_hub==1.14.0' 'click==8.3.1'
      - name: Credential-free offline mock benchmark
        run: |
          go build -o "$RUNNER_TEMP/expert-router" ./cmd/metrum-ai-router
          ROUTER_TEST_BINARY="$RUNNER_TEMP/expert-router" python3 -m unittest discover -s examples/expert-routing-benchmark -p 'test_*.py' -v

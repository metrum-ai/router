name: Decision models mock smoke
on:
  pull_request:
  merge_group:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: decision-models-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'merge_group' }}
jobs:
  decision-models:
    runs-on: router-arc
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install pinned YAML parser
        run: python3 -m pip install 'PyYAML==6.0.3'
      - name: Build router
        run: go build -o "$RUNNER_TEMP/decision-router" ./cmd/metrum-ai-router
      - name: Exercise fake and local decision endpoints
        env:
          ROUTER_TEST_BINARY: ${{ runner.temp }}/decision-router
        run: python3 -m unittest discover -s examples/decision-models -p 'test_*.py' -v

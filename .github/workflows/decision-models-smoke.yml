name: Decision models mock smoke
on:
  pull_request:
    paths:
      - 'examples/decision-models/**'
      - 'examples/catalog/**'
      - '**/*.go'
      - 'cmd/**'
      - 'internal/**'
      - 'testdata/**'
      - 'env*.json'
      - 'go.mod'
      - 'go.sum'
      - 'config/**'
      - 'config*.yaml'
      - 'scripts/**'
      - 'Makefile'
      - '.github/workflows/decision-models-smoke.yml'
  merge_group:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: decision-models-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'merge_group' }}
jobs:
  decision-models:
    runs-on: router-arc-small
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Select merge-group lanes
        if: github.event_name == 'merge_group'
        env:
          CI_BASE_SHA: ${{ github.event.merge_group.base_sha }}
        run: python3 scripts/ci_changes.py
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: github.event_name != 'merge_group' || env.CI_RUN_GO == '1' || env.CI_RUN_EXAMPLES == '1'
        with:
          go-version-file: go.mod
          cache: true
      - name: Install pinned YAML parser
        if: github.event_name != 'merge_group' || env.CI_RUN_GO == '1' || env.CI_RUN_EXAMPLES == '1'
        run: python3 -m pip install 'PyYAML==6.0.3'
      - name: Build router
        if: github.event_name != 'merge_group' || env.CI_RUN_GO == '1' || env.CI_RUN_EXAMPLES == '1'
        run: go build -o "$RUNNER_TEMP/decision-router" ./cmd/metrum-ai-router
      - name: Exercise fake and local decision endpoints
        if: github.event_name != 'merge_group' || env.CI_RUN_GO == '1' || env.CI_RUN_EXAMPLES == '1'
        env:
          ROUTER_TEST_BINARY: ${{ runner.temp }}/decision-router
        run: python3 -m unittest discover -s examples/decision-models -p 'test_*.py' -v

name: Examples catalog mock smoke
on:
  pull_request:
    paths:
      - 'examples/tokenomics/**'
      - 'examples/escalation-continuum/**'
      - 'examples/domain-experts/**'
      - 'examples/kv-cache-cost/**'
      - 'examples/catalog/**'
      - '**/*.go'
      - 'cmd/**'
      - 'internal/**'
      - 'testdata/**'
      - 'env*.json'
      - 'go.mod'
      - 'go.sum'
      - 'config/**'
      - 'config*.yaml'
      - 'scripts/**'
      - 'Makefile'
      - '.github/workflows/examples-catalog-smoke.yml'
  merge_group:
  workflow_dispatch:
concurrency:
  group: examples-catalog-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'merge_group' }}
permissions:
  contents: read
jobs:
  tokenomics:
    runs-on: router-arc-small
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Select merge-group lanes
        if: github.event_name == 'merge_group'
        env:
          CI_BASE_SHA: ${{ github.event.merge_group.base_sha }}
        run: python3 scripts/ci_changes.py
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: github.event_name != 'merge_group' || env.CI_RUN_GO == '1' || env.CI_RUN_EXAMPLES == '1'
        with:
          go-version-file: go.mod
          cache: true
      - name: Install pinned YAML parser
        if: github.event_name != 'merge_group' || env.CI_RUN_GO == '1' || env.CI_RUN_EXAMPLES == '1'
        run: python3 -m pip install 'PyYAML==6.0.3'
      - name: Build router
        if: github.event_name != 'merge_group' || env.CI_RUN_GO == '1' || env.CI_RUN_EXAMPLES == '1'
        run: go build -o "$RUNNER_TEMP/tokenomics-router" ./cmd/metrum-ai-router
      - name: Exercise mock and self-hosted upstreams and quotas
        if: github.event_name != 'merge_group' || env.CI_RUN_GO == '1' || env.CI_RUN_EXAMPLES == '1'
        env:
          ROUTER_TEST_BINARY: ${{ runner.temp }}/tokenomics-router
        run: python3 -m unittest discover -s examples/tokenomics -p 'test_*.py' -v
      - name: Exercise escalation policy and mock tiers
        if: github.event_name != 'merge_group' || env.CI_RUN_GO == '1' || env.CI_RUN_EXAMPLES == '1'
        env:
          ROUTER_TEST_BINARY: ${{ runner.temp }}/tokenomics-router
        run: |
          python3 -m unittest discover -s examples/escalation-continuum -p 'test_*.py' -v
          python3 examples/escalation-continuum/run.py --router "$RUNNER_TEMP/tokenomics-router"
      - name: Exercise domain policy and mock experts
        if: github.event_name != 'merge_group' || env.CI_RUN_GO == '1' || env.CI_RUN_EXAMPLES == '1'
        env:
          ROUTER_TEST_BINARY: ${{ runner.temp }}/tokenomics-router
        run: |
          python3 -m unittest discover -s examples/domain-experts -p 'test_*.py' -v
          python3 examples/domain-experts/run.py --router "$RUNNER_TEMP/tokenomics-router"
      - name: Exercise simulated prefix caching
        if: github.event_name != 'merge_group' || env.CI_RUN_GO == '1' || env.CI_RUN_EXAMPLES == '1'
        env:
          ROUTER_TEST_BINARY: ${{ runner.temp }}/tokenomics-router
        run: |
          python3 examples/kv-cache-cost/run.py --router "$RUNNER_TEMP/tokenomics-router"
          python3 -m unittest discover -s examples/kv-cache-cost -p 'test_*.py' -v

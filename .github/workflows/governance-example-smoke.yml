name: Governance example mock smoke
on:
  pull_request:
  merge_group:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: governance-example-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'merge_group' }}
jobs:
  governance:
    runs-on: router-arc
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install pinned YAML parser
        run: python3 -m pip install 'PyYAML==6.0.3'
      - name: Build router
        run: go build -o "$RUNNER_TEMP/governance-router" ./cmd/metrum-ai-router
      - name: Verify mock governance and adopted caller hashing
        env:
          ROUTER_TEST_BINARY: ${{ runner.temp }}/governance-router
        run: |
          python3 -m unittest discover -s examples/governance -p 'test_*.py' -v
          python3 -m unittest discover -s examples/tokenomics -p 'test_*.py' -v
          python3 -m unittest discover -s examples/escalation-continuum -p 'test_*.py' -v
          python3 examples/escalation-continuum/run.py --router "$ROUTER_TEST_BINARY"
          bash examples/governance/oidc-smoke.sh

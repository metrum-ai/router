name: Run 3 GPU teardown safety smoke
on:
  pull_request:
  merge_group:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: run3-gpu-safety-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'merge_group' }}
jobs:
  gpu-safety:
    runs-on: router-arc
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Run fake-API teardown and lease tests
        run: python3 -m unittest discover -s examples/fine-tune-qwen3p8-27b/run3/gpu -p 'test_*.py' -v

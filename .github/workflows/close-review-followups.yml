name: Close review follow-up rollups

on:
  issues:
    types: [closed]

permissions:
  contents: read
  issues: write

jobs:
  close-linked-children:
    if: contains(github.event.issue.labels.*.name, 'review-followup-rollup')
    runs-on: [self-hosted, Linux, X64, router]
    timeout-minutes: 5
    steps:
      - name: Check out closure automation
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Verify cascade behavior
        run: python3 scripts/close_review_followups_test.py
      - name: Close linked review follow-ups
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 scripts/close_review_followups.py
          --event-path "$GITHUB_EVENT_PATH"
          --repository "$GITHUB_REPOSITORY"

name: Release upgrade and rollback check

on:
  pull_request:
    paths:
      - '.github/workflows/release-upgrade-check.yml'
      - '.github/workflows/release.yml'
      - 'cmd/metrum-ai-router-migrate/**'
      - 'internal/router/migration*.go'
      - 'internal/router/usage_db.go'
      - 'scripts/local_launch_path_smoke.py'
      - 'scripts/release_upgrade_rollback*'
      - 'deploy/kubernetes/examples/postgres-migration-plan-job.yaml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  upgrade-and-rollback:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ${{ vars.ROUTER_HEAVY_RUNNER || 'router-arc' }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Download and verify previous production package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/previous"
          gh release download v4.8.0 -R metrum-ai/router \
            --pattern 'metrum-ai-router-v4.8.0-linux-amd64.tar.gz' \
            --pattern SHA256SUMS --dir "$RUNNER_TEMP/previous"
          cd "$RUNNER_TEMP/previous"
          grep -F '  metrum-ai-router-v4.8.0-linux-amd64.tar.gz' SHA256SUMS | sha256sum --check -
      - name: Build candidate package
        env:
          VERSION: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v5.0.0-rc-ci' }}
          COMMIT: ${{ github.sha }}
        run: GOFLAGS=-p=2 make package-one
      - name: Run upgrade, strict JSON, serving, and rollback checks
        env:
          CANDIDATE_VERSION: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v5.0.0-rc-ci' }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "$(id -u)" -eq 0 ]; then
            useradd --system --home-dir /nonexistent --shell /usr/sbin/nologin router-release-check
            SERVICE_USER=router-release-check
          else
            SERVICE_USER="$(id -un)"
          fi
          python3 scripts/release_upgrade_rollback.py \
            --previous-archive "$RUNNER_TEMP/previous/metrum-ai-router-v4.8.0-linux-amd64.tar.gz" \
            --candidate-archive "dist/metrum-ai-router-${CANDIDATE_VERSION}-linux-amd64.tar.gz" \
            --previous-version v4.8.0 \
            --candidate-version "$CANDIDATE_VERSION" \
            --candidate-commit "$(git rev-parse HEAD)" \
            --service-user "$SERVICE_USER" \
            --report "$RUNNER_TEMP/upgrade-rollback-results.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: release-upgrade-rollback-${{ github.run_id }}
          path: ${{ runner.temp }}/upgrade-rollback-results.json
          if-no-files-found: ignore

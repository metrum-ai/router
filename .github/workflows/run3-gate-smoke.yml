name: Run 3 held-out gate smoke
on:
  pull_request:
    paths:
      - 'examples/fine-tune-qwen3p8-27b/run3/**'
      - 'scripts/ci_changes.py'
      - '.github/workflows/run3-gate-smoke.yml'
  merge_group:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: run3-gate-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'merge_group' }}
jobs:
  gate:
    runs-on: router-arc-small
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Select merge-group lanes
        if: github.event_name == 'merge_group'
        env:
          CI_BASE_SHA: ${{ github.event.merge_group.base_sha }}
        run: python3 scripts/ci_changes.py
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        if: github.event_name != 'merge_group' || env.CI_RUN_GO == '1' || env.CI_RUN_EXAMPLES == '1'
      - name: Synthetic gate construction and type-strict scoring
        if: github.event_name != 'merge_group' || env.CI_RUN_GO == '1' || env.CI_RUN_EXAMPLES == '1'
        run: uv run --with 'PyYAML==6.0.2' python examples/fine-tune-qwen3p8-27b/run3/gate_checks.py -v
      - name: Adapter retrieval failure and checksum tests (offline)
        if: github.event_name != 'merge_group' || env.CI_RUN_GO == '1' || env.CI_RUN_EXAMPLES == '1'
        run: python -m unittest discover -s examples/fine-tune-qwen3p8-27b/run3 -p 'test_retrieve_adapter.py' -v

# The hierarchy compatibility matrix is a required release step (#434).
# release.yml calls this workflow and only packages the release after it
# passes. Both jobs run the local mock matrices (no hosted model calls), then
# scripts/hierarchy_release_gate.py decides the result: every cell must pass
# or be covered by a reviewed entry in tests/agent_compat/release-exceptions.json.
name: Hierarchy compatibility matrix

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  agent-chain:
    name: Agent client chain matrix
    runs-on: router-arc
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: tests/agent_compat/package-lock.json
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      # The runner's exit status is not the gate: a red cell still writes its
      # report, and the gate step below decides with the exception file.
      - name: Run the agent client chain matrix
        continue-on-error: true
        run: make agent-chain-mock
      - name: Gate on the agent client matrix
        run: |
          python3 scripts/hierarchy_release_gate.py \
            --report tests/agent_compat/.out/chain-matrix.json \
            --exceptions tests/agent_compat/release-exceptions.json
      - name: Retain per-cell results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hierarchy-agent-chain-matrix
          path: tests/agent_compat/.out/chain-matrix.json
          if-no-files-found: warn
          retention-days: 30

  codex-chain:
    name: Sandboxed Codex Responses chain matrix
    # The workspace sandbox needs unprivileged user namespaces unavailable on ARC.
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: tests/agent_compat/package-lock.json
      - name: Install pinned offline test dependencies
        run: |
          go mod download
          npm ci --prefix tests/agent_compat --ignore-scripts --no-audit --no-fund
      - name: Run the sandboxed Codex chain matrix
        continue-on-error: true
        run: |
          python3 tests/agent_compat/run_codex_chain_test.py
          python3 tests/agent_compat/run_codex_chain.py --output tests/agent_compat/.out/codex-chain-matrix.json
      - name: Gate on the Codex Responses matrix
        run: |
          python3 scripts/hierarchy_release_gate.py \
            --report tests/agent_compat/.out/codex-chain-matrix.json \
            --exceptions tests/agent_compat/release-exceptions.json
      - name: Retain per-cell results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hierarchy-codex-chain-matrix
          path: tests/agent_compat/.out/codex-chain-matrix.json
          if-no-files-found: warn
          retention-days: 30

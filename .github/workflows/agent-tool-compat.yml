name: Agent tool compatibility

on:
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agent-tool-compat-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'merge_group' }}

jobs:
  local-agent-mock:
    runs-on: router-arc
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: tests/agent_compat/package-lock.json
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
      - name: Pinned clients against local scripted upstream
        run: make agent-tool-mock

  codex-workspace-sandbox:
    # Codex requires unprivileged user namespaces for its workspace sandbox,
    # which router-arc containers do not currently provide. This one VM job is
    # an intentional exception to the ARC runner contract; never bypass sandboxing.
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: tests/agent_compat/package-lock.json
      - name: Install pinned mock-test dependencies
        run: |
          go mod download
          npm ci --prefix tests/agent_compat --ignore-scripts --no-audit --no-fund
      - name: Codex workspace sandbox tool continuation
        run: make agent-tool-mock-codex
      - name: Codex sandbox chain matrix
        run: |
          python3 tests/agent_compat/run_codex_chain_test.py
          python3 tests/agent_compat/run_codex_chain.py --output tests/agent_compat/.out/codex-chain-matrix.json
      - name: Retain Codex chain results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: codex-chain-pr-matrix
          path: tests/agent_compat/.out/codex-chain-matrix.json
          if-no-files-found: warn
          retention-days: 14

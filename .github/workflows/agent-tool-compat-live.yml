name: Tool-call compatibility live matrix

# Nightly live evidence for the client × surface × path matrix (#572). Never runs
# on a pull request: it makes hosted provider calls and is limited to the
# protected `evaluation` environment on main. A cell that regresses from the
# recorded baseline fails this run; a failing cell does not block a release by
# itself, but it needs a triage issue before release (posted rule on #572).
#
# Division of cost safety: dispatching and reserve-before-dispatch live in the
# gate's `scripts/parallel_live_budget.py` (and in the CI lane's planned
# `scripts/live_run.py`); this workflow only adds the monthly ledger, the
# per-run cap, and the results path into `tool_compat_matrix.py`. When
# `live_run.py` lands, only the "Live gate" step changes.

on:
  schedule:
    # One nightly run; the monthly guard in the job refuses to start when the
    # recorded spend is exhausted.
    - cron: '17 7 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agent-tool-compat-live
  cancel-in-progress: false

jobs:
  live-matrix:
    # Hosted provider calls and the dedicated matrix caller token live in this
    # environment, whose deployment policy allows main only.
    environment: evaluation
    if: github.ref == 'refs/heads/main'
    runs-on: router-arc
    timeout-minutes: 45
    env:
      COMPAT_MATRIX_MONTHLY_USD: ${{ vars.COMPAT_MATRIX_MONTHLY_USD || '10' }}
      RUN_CAP_USD: '1'
      LEDGER: tmp/compat-matrix/spend.json
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true

      # The spend ledger is the only durable memory between runs. Cache entries
      # are immutable, so each run writes its own key and restores the newest
      # one by prefix. Limits: if the entry is evicted (cache retention or the
      # 10 GB per-repository budget), the guard restarts the month from 0 and
      # prints a warning; a cache miss on a month that already has runs is
      # undercounted by definition, so treat that warning as "verify this month
      # by hand" rather than "no spend".
      - name: Restore the monthly spend ledger
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: tmp/compat-matrix
          key: compat-matrix-spend-${{ github.run_id }}
          restore-keys: |
            compat-matrix-spend-

      - name: Month and monthly budget guard
        run: |
          set -euo pipefail
          month="$(date -u +%Y-%m)"
          echo "MONTH=$month" >> "$GITHUB_ENV"
          mkdir -p tmp/compat-matrix
          python3 scripts/tool_compat_live_matrix.py guard \
            --ledger "$LEDGER" --month "$month" \
            --monthly-usd "$COMPAT_MATRIX_MONTHLY_USD" --run-cap "$RUN_CAP_USD"

      - name: Live gate (reserve before every dispatch)
        env:
          # Dedicated least-privilege project keys, rotated before expiry; they
          # are only ever read into the environment of this step.
          OPENAI_API_KEY: ${{ secrets.COMPAT_MATRIX_OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.COMPAT_MATRIX_ANTHROPIC_API_KEY }}
          # The gate builds its own disposable router and mints the caller token
          # hash at runtime, so no hash is committed anywhere.
          PARALLEL_LIVE_TOKEN: ${{ secrets.COMPAT_MATRIX_CALLER_TOKEN }}
        run: |
          set -euo pipefail
          uv run --with pyyaml python scripts/parallel_tool_live.py \
            --cap "$RUN_CAP_USD" --out tmp/compat-matrix/gate.json

      - name: Convert the gate run into matrix results
        run: |
          set -euo pipefail
          python3 scripts/tool_compat_live_matrix.py report \
            --gate-report tmp/compat-matrix/gate.json \
            --out tmp/compat-matrix/matrix-live.json \
            --date "$(date -u +%F)" --commit "$GITHUB_SHA"

      - name: Ingest results and compare against the recorded baseline
        run: |
          set -euo pipefail
          git show HEAD:tests/tool_compat/matrix.json > tmp/compat-matrix/baseline.json
          python3 scripts/tool_compat_matrix.py \
            --ingest tmp/compat-matrix/matrix-live.json --write
          python3 scripts/tool_compat_matrix.py --compare tmp/compat-matrix/baseline.json

      - name: Publish the run summary
        if: always()
        run: |
          set -uo pipefail
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from decimal import Decimal
          from pathlib import Path

          report = Path("tmp/compat-matrix/matrix-live.json")
          ledger = Path("tmp/compat-matrix/spend.json")
          print("## Nightly tool-call matrix\n")
          if not report.exists():
              print("No results: the live gate did not produce a report (see the job log).")
              raise SystemExit(0)
          data = json.loads(report.read_text())
          cost = Decimal(str(data.get("cost", {}).get("usd", 0)))
          spent = "unknown"
          month = __import__("os").environ.get("MONTH") or __import__("datetime").datetime.now(
              __import__("datetime").timezone.utc).strftime("%Y-%m")
          if ledger.exists():
              monthly = json.loads(ledger.read_text())["monthly"]
              spent = f"${Decimal(str(monthly.get(month, 0))):.8f} for {month}"
          print(f"Run cost (router usage rows): **${cost:.8f}** · ledger: {spent}\n")
          print("| Cell | Status | Detail |")
          print("| --- | --- | --- |")
          for cell in data["cells"]:
              print(f"| `{cell['id']}` | {cell['status']} | {cell.get('detail') or '-'} |")
          failed = [cell["id"] for cell in data["cells"] if cell["status"] == "fail"]
          if failed:
              print(f"\nFailing cells need a triage issue before release: {', '.join(failed)}")
          PY

      - name: Record the run cost in the ledger (report, else gate report, else the cap)
        if: always()
        run: |
          set -uo pipefail
          python3 scripts/tool_compat_live_matrix.py record-run             --ledger "$LEDGER" --month "$MONTH" \
            --report tmp/compat-matrix/matrix-live.json \
            --gate tmp/compat-matrix/gate.json \
            --cap "$RUN_CAP_USD" --run-id "$GITHUB_RUN_ID"

      - name: Save the monthly spend ledger
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: tmp/compat-matrix
          key: compat-matrix-spend-${{ github.run_id }}

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tool-compat-matrix-live-${{ github.run_id }}
          path: |
            tmp/compat-matrix/matrix-live.json
            tmp/compat-matrix/gate.json
            tmp/compat-matrix/spend.json
            tests/tool_compat/matrix.json
            docs-site/docs/evaluation/tool-call-matrix.md
          if-no-files-found: warn
          retention-days: 90

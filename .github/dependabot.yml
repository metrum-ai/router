version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    cooldown:
      default-days: 7
      semver-major-days: 14
  - package-ecosystem: npm
    directory: /docs-site
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    cooldown:
      default-days: 7
      semver-major-days: 14
  - package-ecosystem: npm
    directory: /internal/router/admindist/web
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
      semver-major-days: 14
  - package-ecosystem: pip
    directory: /services/learned-routing-policy
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
      semver-major-days: 14
  # Evaluator and test dependencies previously missed here were reported in
  # #364 (pinned datasets, pytest, and transitive fsspec advisories sat unseen
  # in these directories). pip manifests use requirements.txt / pyproject.toml.
  - package-ecosystem: pip
    directory: /evaluators/livecodebench
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
      semver-major-days: 14
  - package-ecosystem: pip
    directory: /tests/api_compat
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
      semver-major-days: 14
  - package-ecosystem: pip
    directory: /tests/harbor
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
      semver-major-days: 14
  # github-actions cooldown supports only default-days (action tags are not
  # semver-resolved), per Dependabot config validation.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7

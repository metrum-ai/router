#
# Edge bundle accelerator overlay: AMD (Strix Halo class, gfx1151).
# The official upstream ROCm image supports gfx1151 (Strix Halo) and matches
# deploy/reference/amd-strix-halo-edge/images.lock.
# The ROCm vLLM image runs as root inside its own container and needs no added
# capabilities; the device nodes are passed in explicitly and nothing is mounted
# from the host besides the cache volume and the run directory.

services:
  vllm-tiny:
    image: vllm/vllm-openai-rocm:v0.33.0@sha256:4fcd39b758b660c4e9c345c021e2ea8f0ccdb31e3c32507d676cc3005ae83fba
    security_opt:
      # The base already declares no-new-privileges; Compose appends sequence
      # fields, so repeating it here fails validation with
      # "security_opt array items[0,1] must be unique".
      - seccomp:unconfined
    # Numeric host GIDs keep device access aligned with the host device-node owners.
    group_add: ["${VIDEO_GID:?set VIDEO_GID (stat -c %g /dev/dri/card0)}",
                "${RENDER_GID:?set RENDER_GID (stat -c %g /dev/dri/renderD128)}"]
    devices: ["/dev/kfd", "/dev/dri"]
    # Set the serving command explicitly so startup does not depend on image defaults.
    entrypoint: ["vllm", "serve"]
    environment:
      HIP_VISIBLE_DEVICES: "0"
      ROCR_VISIBLE_DEVICES: "0"

  vllm-primary:
    # Restated here on purpose: the base file makes the primary wait for the tiny slot to
    # be healthy (each server sizes its KV cache against the device's free memory), and a
    # reader of this overlay should see that the ROCm path is sequenced the same way.
    # Measured on Halo with both loading at once: tiny reported
    # "Available KV cache memory: -112.64 GiB" and the primary -0.22 GiB.
    depends_on:
      vllm-tiny:
        condition: service_healthy
    image: vllm/vllm-openai-rocm:v0.33.0@sha256:4fcd39b758b660c4e9c345c021e2ea8f0ccdb31e3c32507d676cc3005ae83fba
    security_opt:
      # The base already declares no-new-privileges; Compose appends sequence
      # fields, so repeating it here fails validation with
      # "security_opt array items[0,1] must be unique".
      - seccomp:unconfined
    # Numeric host GIDs keep device access aligned with the host device-node owners.
    group_add: ["${VIDEO_GID:?set VIDEO_GID (stat -c %g /dev/dri/card0)}",
                "${RENDER_GID:?set RENDER_GID (stat -c %g /dev/dri/renderD128)}"]
    devices: ["/dev/kfd", "/dev/dri"]
    # Set the serving command explicitly so startup does not depend on image defaults.
    entrypoint: ["vllm", "serve"]
    environment:
      HIP_VISIBLE_DEVICES: "0"
      ROCR_VISIBLE_DEVICES: "0"

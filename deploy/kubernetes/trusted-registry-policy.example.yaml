apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-trusted-image-registries
spec:
  validationFailureAction: Enforce
  background: true
  rules:
    - name: require-trusted-registries-and-digests
      match:
        any:
          - resources:
              kinds:
                - Pod
      validate:
        message: Images must come from an approved registry and use an immutable digest.
        foreach:
          - list: request.object.spec.containers
            deny:
              conditions:
                any:
                  - key: "{{ element.image }}"
                    operator: NotMatches
                    value: "^(registry\\.example\\.com/metrum-ai-router|docker\\.io/vllm/vllm-openai(-rocm)?):[^@]+@sha256:[a-f0-9]{64}$"
          - list: request.object.spec.initContainers || `[]`
            deny:
              conditions:
                any:
                  - key: "{{ element.image }}"
                    operator: NotMatches
                    value: "^(registry\\.example\\.com/metrum-ai-router|docker\\.io/vllm/vllm-openai(-rocm)?):[^@]+@sha256:[a-f0-9]{64}$"

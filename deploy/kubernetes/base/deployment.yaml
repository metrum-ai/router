apiVersion: apps/v1
kind: Deployment
metadata:
  name: metrum-ai-router
  labels:
    app.kubernetes.io/name: metrum-ai-router
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: metrum-ai-router
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: metrum-ai-router
    spec:
      serviceAccountName: metrum-ai-router
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: router
          image: registry.example.com/metrum-ai-router:<version>-linux-amd64
          imagePullPolicy: IfNotPresent
          args: ["--config", "/app/config/config.yaml"]
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 24
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: config
              mountPath: /app/config/config.yaml
              subPath: config.yaml
              readOnly: true
            - name: secrets
              mountPath: /app/config/env.json
              subPath: env.json
              readOnly: true
            - name: state
              mountPath: /app/state
            - name: logs
              mountPath: /app/logs
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: metrum-ai-router-config
        - name: secrets
          secret:
            secretName: metrum-ai-router-secrets
            defaultMode: 0400
        - name: state
          persistentVolumeClaim:
            claimName: metrum-ai-router-state
        - name: logs
          emptyDir: {}
        - name: tmp
          emptyDir: {}

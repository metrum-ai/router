apiVersion: v1
kind: ConfigMap
metadata:
  name: metrum-ai-router-config
  labels:
    app.kubernetes.io/name: metrum-ai-router
data:
  config.yaml: |
    server:
      listen: ":8080"
      env_file: /app/config/env.json
      logging:
        path: /app/logs/requests.jsonl
      usage_db:
        enabled: true
        driver: sqlite
        path: /app/state/usage.sqlite
        migration_policy: deployment-job
      admin_reports:
        enabled: false
      upstream:
        timeout_ms: 120000
        max_response_bytes: 52428800
    state_path: /app/state/router-state.json
    providers: {}
    models: {}
    users: []
    projects: []
    project_memberships: []
    callers: []

apiVersion: batch/v1
kind: Job
metadata:
  name: metrum-ai-router-migration
  labels:
    app.kubernetes.io/name: metrum-ai-router
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 1800
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: metrum-ai-router
    spec:
      automountServiceAccountToken: false
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migration
          image: registry.example.com/metrum-ai-router:<version>-linux-amd64@sha256:<digest>
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-ec"]
          args:
            - |
              action="${MIGRATION_ACTION:-apply}"
              apply_online_prefix() {
                if output=$("$@" 2>&1); then
                  printf '%s\n' "$output"
                  return 0
                fi
                status=$?
                case "$output" in
                  "migration apply: migration "*" requires explicit maintenance runner") return 10 ;;
                  *) printf '%s\n' "$output" >&2; return "$status" ;;
                esac
              }
              apply_maintenance_prefix() {
                if output=$("$@" 2>&1); then
                  printf '%s\n' "$output"
                  return 0
                fi
                status=$?
                case "$output" in
                  "migration maintenance: migration "*" requires its declared runner mode") return 10 ;;
                  *) printf '%s\n' "$output" >&2; return "$status" ;;
                esac
              }
              apply_scope() {
                scope="$1"
                dsn_env="$2"
                while :; do
                  if apply_online_prefix /app/bin/metrum-ai-router-migrate --scope="$scope" --action=apply --driver=postgres --dsn-env="$dsn_env" --json; then
                    return 0
                  else
                    status=$?
                    [ "$status" -eq 10 ] || return "$status"
                  fi
                  if apply_maintenance_prefix /app/bin/metrum-ai-router-migrate --scope="$scope" --action=maintenance --backup-evidence-ref="$BACKUP_EVIDENCE_REF" --driver=postgres --dsn-env="$dsn_env" --json; then
                    :
                  else
                    status=$?
                    [ "$status" -eq 10 ] || return "$status"
                  fi
                done
              }
              case "$action" in
                plan)
                  /app/bin/metrum-ai-router-migrate --scope=usage --action=plan --driver=postgres --dsn-env=ROUTER_USAGE_DB_DSN --json
                  /app/bin/metrum-ai-router-migrate --scope=router-config --action=plan --driver=postgres --dsn-env=ROUTER_CONFIG_DB_DSN --json
                  ;;
                apply)
                  : "${BACKUP_EVIDENCE_REF:?set an approved backup evidence reference}"
                  apply_scope usage ROUTER_USAGE_DB_DSN
                  apply_scope router-config ROUTER_CONFIG_DB_DSN
                  /app/bin/metrum-ai-router-migrate --scope=usage --action=verify --driver=postgres --dsn-env=ROUTER_USAGE_DB_DSN --json
                  /app/bin/metrum-ai-router-migrate --scope=router-config --action=verify --driver=postgres --dsn-env=ROUTER_CONFIG_DB_DSN --json
                  ;;
                *) echo 'MIGRATION_ACTION must be plan or apply' >&2; exit 2 ;;
              esac
          env:
            - name: MIGRATION_ACTION
              value: apply
            - name: BACKUP_EVIDENCE_REF
              valueFrom:
                configMapKeyRef:
                  name: metrum-ai-router-migration
                  key: backup-evidence-ref
                  optional: true
            - name: ROUTER_USAGE_DB_DSN
              valueFrom:
                secretKeyRef:
                  name: metrum-ai-router-database
                  key: usage-dsn
            - name: ROUTER_CONFIG_DB_DSN
              valueFrom:
                secretKeyRef:
                  name: metrum-ai-router-database
                  key: router-config-dsn
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: tmp
          emptyDir: {}

#
# Admin control-plane overlay (v4.8.0, #817).
#
# Starts the admin listener on the pod IP, exposes it only through a private
# ClusterIP Service with no Ingress, and adds default-deny ingress with
# explicit allows: the serving port stays reachable, the admin port accepts
# only pods labelled access.metrum.ai/admin-client: "true". Plaintext inside the
# pod network is the reference default; the operator guide explains how to mount
# router-native TLS instead.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: metrum-ai-router
resources:
  - ../../base
  - service-admin.yaml
  - networkpolicy-admin.yaml
patches:
  - path: patch-deployment.yaml
generatorOptions:
  disableNameSuffixHash: true
configMapGenerator:
  - name: metrum-ai-router-config
    behavior: replace
    files:
      - config.yaml

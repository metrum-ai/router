#
# Private admin Service. ClusterIP only: no NodePort, no LoadBalancer and no
# Ingress may select it. Clients reach it as
# http://metrum-ai-router-admin.<namespace>.svc:8081 from selected pods.
apiVersion: v1
kind: Service
metadata:
  name: metrum-ai-router-admin
  labels:
    app.kubernetes.io/name: metrum-ai-router
    app.kubernetes.io/component: admin
spec:
  type: ClusterIP
  internalTrafficPolicy: Cluster
  selector:
    app.kubernetes.io/name: metrum-ai-router
  ports:
    - name: admin
      port: 8081
      targetPort: admin
      protocol: TCP

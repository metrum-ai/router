apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-chat
  namespace: metrum-ai-router
  labels:
    app.kubernetes.io/name: vllm-chat
    app.kubernetes.io/component: local-serving
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: vllm-chat
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vllm-chat
        app.kubernetes.io/component: local-serving
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: vllm
          image: vllm/vllm-openai:v0.11.0
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          env:
            - name: HOME
              value: /cache
            - name: HF_HOME
              value: /cache/huggingface
            - name: XDG_CACHE_HOME
              value: /cache
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
          args:
            - "--model"
            - "Qwen/Qwen3-4B-Instruct-2507"
            - "--served-model-name"
            - "local-small-chat"
            - "--host"
            - "0.0.0.0"
            - "--port"
            - "8000"
            - "--max-model-len"
            - "8192"
          ports:
            - name: http
              containerPort: 8000
          resources:
            limits:
              nvidia.com/gpu: "1"
            requests:
              nvidia.com/gpu: "1"
          volumeMounts:
            - name: cache
              mountPath: /cache
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: cache
          emptyDir: {}
        - name: tmp
          emptyDir: {}

apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-chat
  namespace: metrum-ai-router
  labels:
    app.kubernetes.io/name: vllm-chat
    app.kubernetes.io/component: local-serving
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: vllm-chat
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vllm-chat
        app.kubernetes.io/component: local-serving
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      nodeSelector:
        accelerator: amd
        vendor: amd
      containers:
        - name: vllm
          image: vllm/vllm-openai-rocm:v0.25.0
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          env:
            - name: HOME
              value: /cache
            - name: HF_HOME
              value: /cache/huggingface
            - name: XDG_CACHE_HOME
              value: /cache
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
          args:
            - "--model"
            - "Qwen/Qwen3.5-4B"
            - "--served-model-name"
            - "local-small-chat"
            - "--host"
            - "0.0.0.0"
            - "--port"
            - "8000"
            - "--max-model-len"
            - "8192"
          ports:
            - name: http
              containerPort: 8000
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 180
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          resources:
            limits:
              amd.com/gpu: "1"
            requests:
              amd.com/gpu: "1"
              cpu: "4"
              memory: 16Gi
          volumeMounts:
            - name: cache
              mountPath: /cache
            - name: tmp
              mountPath: /tmp
            - name: dshm
              mountPath: /dev/shm
      volumes:
        - name: cache
          emptyDir: {}
        - name: tmp
          emptyDir: {}
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 16Gi

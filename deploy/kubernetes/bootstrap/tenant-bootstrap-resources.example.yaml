# Copy this reviewed template into one explicitly selected tenant namespace.
# It contains no Secret resource and does not grant cross-namespace authority.
# The namespace default-deny NetworkPolicy was moved to
# tenant-default-network-policy.example.yaml (Refs #414): apply it once at
# namespace creation as a platform-administrator step; the provisioner
# identity no longer writes NetworkPolicy objects.
apiVersion: v1
kind: ResourceQuota
metadata:
  name: tenant-workload-quota
  namespace: replace-with-approved-tenant-namespace
spec:
  hard:
    requests.cpu: "4"
    requests.memory: 8Gi
    limits.cpu: "8"
    limits.memory: 16Gi
    pods: "20"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: tenant-default-limits
  namespace: replace-with-approved-tenant-namespace
spec:
  limits:
    - type: Container
      defaultRequest:
        cpu: 100m
        memory: 128Mi
      default:
        cpu: "1"
        memory: 1Gi

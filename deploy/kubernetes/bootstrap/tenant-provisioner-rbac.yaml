# Namespace-scoped binding template. A platform administrator creates one copy
# in each approved tenant namespace after discovery validates Linkerd policy CRDs.
# It intentionally cannot create or mutate workloads: a constrained platform
# release identity applies router workloads after admission policy validation.
# This prevents a bootstrap credential from mounting or impersonating Secrets.
#
# Least-privilege review (2026-W44, Refs #365): the Role grants write access
# only to the exact resources the tenant bootstrap templates create
# (tenant-bootstrap-resources.example.yaml, tenant-linkerd-policy.example.yaml):
# ResourceQuota, LimitRange, and namespace-scoped Linkerd
# Server/ServerAuthorization. Ingress access is read-only so bootstrap can
# verify the selected tenant ingress before applying the guard policy; Ingress
# objects are owned by the release identity. ConfigMap and Service writes were
# removed because no bootstrap template creates them. There is no delete verb:
# teardown removes the whole tenant namespace. Token automount stays enabled
# because the provisioning job calls the API; workloads that do not call the
# API must not use this account.
#
# KSV-0056 follow-up (Refs #414): NetworkPolicy write access was removed
# entirely. The namespace default-deny policy is a one-time, reviewed step at
# namespace creation (tenant-default-network-policy.example.yaml), applied by
# the platform administrator together with this binding; the provisioner
# identity no longer needs standing NetworkPolicy write access. The
# provisioning job never mutates NetworkPolicy objects after that step.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: tenant-provisioner
  namespace: replace-with-approved-tenant-namespace
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: tenant-bootstrap-provisioner
  namespace: replace-with-approved-tenant-namespace
rules:
  - apiGroups: [""]
    resources: ["resourcequotas", "limitranges"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["policy.linkerd.io"]
    resources: ["servers", "serverauthorizations"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: tenant-bootstrap-provisioner
  namespace: replace-with-approved-tenant-namespace
subjects:
  - kind: ServiceAccount
    name: tenant-provisioner
    namespace: replace-with-approved-tenant-namespace
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: tenant-bootstrap-provisioner

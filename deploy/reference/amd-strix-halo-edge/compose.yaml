#
# Reference deployment: amd-strix-halo-edge
# 1x AMD Ryzen AI MAX+ 395 (Strix Halo, gfx1151, 128 GB unified memory), ROCm.
# Model-server image pins must match images.lock; scripts/check_reference_configs.py
# fails when they drift. The router image is supplied by the operator.
name: metrum-router-reference-amd-strix-halo-edge

x-vllm-service: &vllm-service
  restart: unless-stopped
  ipc: host
  shm_size: 8gb
  security_opt:
    - no-new-privileges:true
    # ROCm initialisation needs syscalls the default profile blocks.
    - seccomp:unconfined
  group_add:
    - video
    - render
  devices:
    - /dev/kfd
    - /dev/dri
  environment:
    HF_HOME: /cache
    HF_HUB_ENABLE_HF_TRANSFER: "1"
    HIP_VISIBLE_DEVICES: "0"
    ROCR_VISIBLE_DEVICES: "0"
  volumes:
    - hf-cache:/cache
  healthcheck:
    test:
      - CMD-SHELL
      - >-
        python3 -c "import urllib.request,sys;
        sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).status == 200 else 1)"
    interval: 15s
    timeout: 5s
    retries: 20
    start_period: 60m

services:
  vllm-tiny:
    <<: *vllm-service
    image: rocm/vllm:rocm7.13.0_gfx1151_ubuntu24.04_py3.13_pytorch_2.10.0_vllm_0.19.1@sha256:394194d36edcf9b36bcb563e143b21b80e64e7d04f33a447b448c0c0c00c04a8
    command:
      - --model
      - ${TINY_MODEL_ID:-Qwen/Qwen3-1.7B}
      - --revision
      - ${TINY_MODEL_REVISION:-70d244cc86ccca08cf5af4e1e306ecf908b1ad5e}
      - --served-model-name
      - local-tiny
      - --max-model-len
      - ${MAX_MODEL_LEN:-8192}
      - --gpu-memory-utilization
      - ${TINY_GPU_MEMORY_UTILIZATION:-0.05}
      - --api-key
      - ${LOCAL_VLLM_API_KEY:?set LOCAL_VLLM_API_KEY}
      - --host
      - 0.0.0.0
      - --port
      - "8000"
    ports:
      - 127.0.0.1:${TINY_VLLM_PORT:-8002}:8000

  vllm-primary:
    <<: *vllm-service
    image: rocm/vllm:rocm7.13.0_gfx1151_ubuntu24.04_py3.13_pytorch_2.10.0_vllm_0.19.1@sha256:394194d36edcf9b36bcb563e143b21b80e64e7d04f33a447b448c0c0c00c04a8
    command:
      - --model
      - ${PRIMARY_MODEL_ID:-Qwen/Qwen3-30B-A3B-Instruct-2507}
      - --revision
      - ${PRIMARY_MODEL_REVISION:-0d7cf23991f47feeb3a57ecb4c9cee8ea4a17bfe}
      - --served-model-name
      - local-primary
      - --max-model-len
      - ${MAX_MODEL_LEN:-8192}
      - --gpu-memory-utilization
      - ${PRIMARY_GPU_MEMORY_UTILIZATION:-0.80}
      - --api-key
      - ${LOCAL_VLLM_API_KEY:?set LOCAL_VLLM_API_KEY}
      - --host
      - 0.0.0.0
      - --port
      - "8000"
    ports:
      - 127.0.0.1:${PRIMARY_VLLM_PORT:-8001}:8000

  router:
    image: ${ROUTER_IMAGE:?set ROUTER_IMAGE to the router runtime image, for example metrum-ai-router:<version>-linux-amd64}
    restart: unless-stopped
    command: ["--config", "/app/config/config.yaml"]
    working_dir: /app/state
    environment:
      ROUTER_ID_TRANSFORM_KEY: ${ROUTER_ID_TRANSFORM_KEY:?set ROUTER_ID_TRANSFORM_KEY to 64 random bytes, hex or base64}
      LOCAL_VLLM_API_KEY: ${LOCAL_VLLM_API_KEY:?set LOCAL_VLLM_API_KEY}
      REFERENCE_ADMIN_PASSWORD_HASH: ${REFERENCE_ADMIN_PASSWORD_HASH:?set REFERENCE_ADMIN_PASSWORD_HASH to a bcrypt hash}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    ports:
      - 127.0.0.1:${ROUTER_HTTP_PORT:-8080}:8080
    volumes:
      - ./config/config.yaml:/app/config/config.yaml:ro
      - ./state:/app/state
      - ./logs:/app/logs
    depends_on:
      vllm-tiny:
        condition: service_healthy
      vllm-primary:
        condition: service_healthy

volumes:
  hf-cache:

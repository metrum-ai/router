#
# Datacenter tier of the layered deployment reference (#434).
# Owns the frontier credentials, accepts the edge router's token as a caller,
# and records its own usage rows. Cache stays off: the edge is the nearest safe
# cache.
server:
  listen: 0.0.0.0:8080
  default_model_group: dc-frontier
  # Long agent turns and edge-class local models stream for minutes (#432/#434).
  # The write deadline is absolute, so it stays above the upstream budget and
  # event streams use the progress deadline: each successful stream write
  # extends it by stream_idle_timeout_ms, a stalled stream ends at that window.
  read_timeout_ms: 60000
  write_timeout_ms: 660000
  idle_timeout_ms: 120000
  stream_idle_timeout_ms: 120000
  identifiers:
    mode: rewrite
    transform:
      current:
        key_id: ${ROUTER_ID_TRANSFORM_KEY_ID}
        key: ${ROUTER_ID_TRANSFORM_KEY}
  cache:
    enabled: false
  logging:
    path: ${DC_LOG_PATH}
    rotate_mb: 256
    keep: 7
  usage_db:
    enabled: true
    driver: ${DC_USAGE_DRIVER}
    path: ${DC_USAGE_PATH}
    dsn: ${DC_USAGE_DSN}
    migration_policy: deployment-job
    drain_timeout_ms: 10000
  diagnostics:
    enabled: true
    retention_days: 14
    store_sanitized_upstream_errors: true
    max_error_bytes: 2048
  upstream:
    max_router_hops: ${MAX_ROUTER_HOPS}
    timeout_ms: ${DC_UPSTREAM_TIMEOUT_MS}
    max_response_bytes: 33554432

admin:
  enabled: false

state_path: ${DC_STATE_PATH}

providers:
  # Terminal hop: a hosted frontier API or a self-hosted vLLM/SGLang endpoint.
  # The demo stack points this at the loopback frontier fixture.
  frontier:
    base_url: ${FRONTIER_BASE_URL}
    dialect: openai-chat
    auth_scheme: bearer
    api_key: ${FRONTIER_API_KEY}
    key_id: frontier
    models:
      # A quoted key: an unquoted environment reference at line start is not
      # valid YAML, so the key is quoted.
      "${FRONTIER_MODEL}":
        model: ${FRONTIER_MODEL}
        input_price_per_million_usd: ${FRONTIER_INPUT_PRICE_USD_PER_MTOK}
        output_price_per_million_usd: ${FRONTIER_OUTPUT_PRICE_USD_PER_MTOK}
        pricing_source: ${FRONTIER_PRICING_SOURCE}
        pricing_updated_at: "${FRONTIER_PRICING_UPDATED_AT}"
        input_modalities: [text]
        output_modalities: [text]

  cpu_small:
    base_url: ${CPU_BASE_URL}
    dialect: openai-chat
    # vLLM CPU does not require authentication by default; this placeholder
    # keeps the router's provider auth header non-empty and is not a secret.
    auth_scheme: bearer
    api_key: cpu-demo-no-key
    key_id: cpu-small
    models:
      "${CPU_MODEL}":
        model: ${CPU_MODEL}

  # The edge is reachable from the datacenter tier so a request can loop back
  # for edge-local models; this is also how the loop-protection check drives a
  # real cycle. Give it its own model namespace.
  edge_loopback:
    base_url: ${EDGE_ROUTER_URL}
    dialect: openai-chat
    auth_scheme: bearer
    api_key: ${DC_LOOPBACK_TOKEN}
    key_id: edge-loopback
    upstream_kind: router
    models:
      edge-loop-demo:
        model: edge-loop-demo

models:
  dc-frontier:
    strategy: static
    targets:
      - provider: frontier
        model_ref: ${FRONTIER_MODEL}

  # A small CPU model serves only compact requests. Request-shape eligibility
  # excludes larger prompts and output caps before target ranking; an upstream
  # timeout or failure retries the frontier target before any response starts.
  agent-small:
    strategy: dynamic_score
    targets:
      - provider: cpu_small
        model_ref: ${CPU_MODEL}
        weight: 10
        timeout_ms: ${CPU_ATTEMPT_TIMEOUT_MS}
        tier: cpu
        tags: [cpu, small-model]
        request_shape_support:
          max_estimated_input_tokens: 800
          max_requested_output_tokens: 128
          validation_status: limited
          validation_notes: "Existing CPU latency evidence only; compact text requests; no semantic-quality claim"
      - provider: frontier
        model_ref: ${FRONTIER_MODEL}
        weight: 1
        tier: frontier
        tags: [frontier]
    routing_policy:
      dynamic_score:
        cold_start_policy: configured_weight
        min_observations: 20
        observation_window_seconds: 600
        max_score_adjustment_percent: 50
        signals:
          request_shape: { enabled: true }
          complexity: { enabled: true }
          observed_performance: { enabled: true }
          cost: { enabled: true }
        score_terms:
          - name: compact_request
            when: { complexity_lte: standard }
            prefer_tags: [cpu]
            expression: "0.50 * cost_score + 0.25 * latency_score + 0.25 * reliability_score"
          - name: complex_request
            when: { complexity_gte: complex }
            prefer_tags: [frontier]
            expression: "0.55 * reliability_score + 0.30 * latency_score + 0.15 * cost_score"
        thresholds:
          max_ttfb_ms: 1000
          max_error_rate: 0.10
          max_timeout_rate: 0.05
          max_p95_latency_ms: 6000

  # Deliberate cycle for the loop-protection check. The edge has a matching
  # `edge-loop-demo` group that routes back here, so a request bounces until
  # the hop limit answers 508.
  loop-demo:
    strategy: static
    targets:
      - provider: edge_loopback
        model_ref: edge-loop-demo

users:
  - id: ${DC_OWNER_USER}
    name: Datacenter Operations
    type: service_account
    status: active

projects:
  - id: ${DC_PROJECT}
    name: Datacenter Production
    status: active

project_memberships:
  - user_id: ${DC_OWNER_USER}
    project: ${DC_PROJECT}
    role: admin
    status: active

callers:
  # The edge router authenticates here with its own token. Its usage rows are
  # therefore attributable to the edge hop, not to the original caller.
  - id: ${DC_CALLER_ID}
    owner_user: ${DC_OWNER_USER}
    project: ${DC_PROJECT}
    environment: ${DC_ENVIRONMENT}
    status: active
    token_hash: "${DC_CALLER_TOKEN_HASH}"
    token_id: ${DC_CALLER_TOKEN_ID}
    allow: [dc-frontier, agent-small, loop-demo]
    rate:
      rpm: ${DC_CALLER_RPM}
      tpm: ${DC_CALLER_TPM}
      concurrent: ${DC_CALLER_CONCURRENT}
    quota:
      day:
        requests: 0
        tokens: 0
      month:
        tokens: 0
      soft_pct: 80
    key:
      lifetime_tokens: 0
      soft_pct: 0

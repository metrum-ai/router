#
# Edge tier of the layered deployment reference (#434).
# Every ${...} value comes from the environment (compose env_file or the
# operator's secret store); the router expands only ${NAME}, never a default.
server:
  listen: 0.0.0.0:8080
  default_model_group: edge-default
  identifiers:
    # Rewrite caller-visible upstream identifiers. Generate the key with
    # openssl rand -hex 64 (64 bytes); passthrough would expose provider names to callers.
    mode: rewrite
    transform:
      current:
        key_id: ${ROUTER_ID_TRANSFORM_KEY_ID}
        key: ${ROUTER_ID_TRANSFORM_KEY}
  cache:
    # Nearest safe level: the edge answers repeat caller requests itself.
    # Caller-scoped and deterministic; the datacenter tier keeps its cache off.
    enabled: true
    max_bytes: 134217728
    default_ttl: 30s
  logging:
    path: ${EDGE_LOG_PATH}
    rotate_mb: 256
    keep: 7
  usage_db:
    enabled: true
    driver: ${EDGE_USAGE_DRIVER}
    path: ${EDGE_USAGE_PATH}
    dsn: ${EDGE_USAGE_DSN}
    migration_policy: deployment-job
    drain_timeout_ms: 10000
  diagnostics:
    enabled: true
    retention_days: 14
    store_sanitized_upstream_errors: true
    max_error_bytes: 2048
  upstream:
    # Edge + datacenter hop, with headroom for one more tier.
    max_router_hops: ${MAX_ROUTER_HOPS}
    timeout_ms: 600000
    max_response_bytes: 33554432

state_path: ${EDGE_STATE_PATH}

providers:
  # The datacenter router is an authenticated OpenAI-compatible upstream.
  # `upstream_kind: router` keeps a downstream 429/typed 503 and its
  # Retry-After instead of normalizing them into a generic upstream failure.
  dc_router:
    base_url: ${DC_ROUTER_URL}
    dialect: openai-chat
    auth_scheme: bearer
    api_key: ${DC_ROUTER_TOKEN}
    key_id: dc-router
    upstream_kind: router
    models:
      dc-frontier:
        model: dc-frontier
      loop-demo:
        model: loop-demo

models:
  edge-default:
    strategy: static
    targets:
      - provider: dc_router
        model_ref: dc-frontier

  # Deliberate cycle for the loop-protection check: the datacenter tier has a
  # `loop-demo` group that routes back here, so a request bounces until the hop
  # limit answers 508.
  edge-loop-demo:
    strategy: static
    targets:
      - provider: dc_router
        model_ref: loop-demo

users:
  - id: ${EDGE_OWNER_USER}
    name: Edge Operations
    type: service_account
    status: active

projects:
  - id: ${EDGE_PROJECT}
    name: Edge Production
    status: active

project_memberships:
  - user_id: ${EDGE_OWNER_USER}
    project: ${EDGE_PROJECT}
    role: admin
    status: active

callers:
  # Token hashes are PBKDF2-SHA3-512 verifiers generated by
  # `metrum-ai-routerctl callers generate`. Never place a raw caller token here.
  - id: ${EDGE_CALLER_ID}
    owner_user: ${EDGE_OWNER_USER}
    project: ${EDGE_PROJECT}
    environment: ${EDGE_ENVIRONMENT}
    status: active
    token_hash: "${EDGE_CALLER_TOKEN_HASH}"
    token_id: ${EDGE_CALLER_TOKEN_ID}
    # `edge-loop-demo` exists only for the loop-protection check; remove it
    # from a real deployment's caller allow list.
    allow: [edge-default, edge-loop-demo]
    rate:
      rpm: ${EDGE_CALLER_RPM}
      tpm: ${EDGE_CALLER_TPM}
      concurrent: ${EDGE_CALLER_CONCURRENT}
    quota:
      day:
        requests: ${EDGE_CALLER_DAY_REQUESTS}
        tokens: ${EDGE_CALLER_DAY_TOKENS}
      month:
        tokens: ${EDGE_CALLER_MONTH_TOKENS}
      soft_pct: 80
    key:
      lifetime_tokens: 0
      soft_pct: 0

  # The datacenter tier's loopback token, used only by the loop-protection
  # check and by edge-local models reached from the datacenter tier.
  - id: ${EDGE_LOOPBACK_CALLER_ID}
    owner_user: ${EDGE_OWNER_USER}
    project: ${EDGE_PROJECT}
    environment: ${EDGE_ENVIRONMENT}
    status: active
    token_hash: "${EDGE_LOOPBACK_TOKEN_HASH}"
    token_id: ${EDGE_LOOPBACK_TOKEN_ID}
    allow: [edge-loop-demo]
    rate:
      rpm: 60
      tpm: 60000
      concurrent: 8
    quota:
      day:
        requests: 0
        tokens: 0
      month:
        tokens: 0
      soft_pct: 80
    key:
      lifetime_tokens: 0
      soft_pct: 0

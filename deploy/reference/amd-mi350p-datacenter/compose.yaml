#
# Reference deployment: amd-mi350p-datacenter
# 1x AMD Instinct MI350P 144 GB (gfx950) with ROCm.
# Model-server image pins must match images.lock; scripts/check_reference_configs.py
# fails when they drift. The router image is supplied by the operator.
name: metrum-router-reference-amd-mi350p-datacenter

x-vllm-service: &vllm-service
  restart: unless-stopped
  ipc: host
  security_opt:
    - no-new-privileges:true
    # ROCm initialisation needs syscalls the default profile blocks.
    - seccomp:unconfined
  group_add:
    - video
    - render
  devices:
    - /dev/kfd
    - /dev/dri
  environment:
    HF_HOME: /cache
    HF_HUB_ENABLE_HF_TRANSFER: "1"
    # Keep the allocator inside the container's visible device set.
    HIP_VISIBLE_DEVICES: "0"
    ROCR_VISIBLE_DEVICES: "0"
  volumes:
    - hf-cache:/cache
  healthcheck:
    test:
      - CMD-SHELL
      - >-
        python3 -c "import urllib.request,sys;
        sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).status == 200 else 1)"
    interval: 15s
    timeout: 5s
    retries: 20
    start_period: 45m

services:
  vllm-tiny:
    <<: *vllm-service
    image: rocm/vllm:rocm7.13.0_gfx950-dcgpu_ubuntu24.04_py3.13_pytorch_2.10.0_vllm_0.19.1@sha256:3b20f0a32530aefa2416aa30f64011fdcab00c44676a915044b9a17379342fcc
    # The ROCm image carries no entrypoint and its default CMD only pins the
    # matching wheel, so the server is started explicitly; AMD's documented form
    # is `vllm serve ...`.
    entrypoint: ["vllm", "serve"]
    command:
      - --model
      - ${TINY_MODEL_ID:-Qwen/Qwen3-1.7B}
      - --revision
      - ${TINY_MODEL_REVISION:-70d244cc86ccca08cf5af4e1e306ecf908b1ad5e}
      - --served-model-name
      - local-tiny
      - --max-model-len
      - ${MAX_MODEL_LEN:-8192}
      - --gpu-memory-utilization
      - ${TINY_GPU_MEMORY_UTILIZATION:-0.09}
      - --api-key
      - ${LOCAL_VLLM_API_KEY:?set LOCAL_VLLM_API_KEY}
      - --host
      - 0.0.0.0
      - --port
      - "8000"
    ports:
      - 127.0.0.1:${TINY_VLLM_PORT:-8002}:8000

  vllm-chat:
    <<: *vllm-service
    image: rocm/vllm:rocm7.13.0_gfx950-dcgpu_ubuntu24.04_py3.13_pytorch_2.10.0_vllm_0.19.1@sha256:3b20f0a32530aefa2416aa30f64011fdcab00c44676a915044b9a17379342fcc
    # The ROCm image carries no entrypoint and its default CMD only pins the
    # matching wheel, so the server is started explicitly; AMD's documented form
    # is `vllm serve ...`.
    entrypoint: ["vllm", "serve"]
    command:
      - --model
      - ${CHAT_MODEL_ID:-Qwen/Qwen3-32B}
      - --revision
      - ${CHAT_MODEL_REVISION:-9216db5781bf21249d130ec9da846c4624c16137}
      - --served-model-name
      - local-chat
      - --quantization
      - ${VLLM_QUANTIZATION:-fp8}
      - --max-model-len
      - ${MAX_MODEL_LEN:-8192}
      - --gpu-memory-utilization
      - ${CHAT_GPU_MEMORY_UTILIZATION:-0.46}
      - --api-key
      - ${LOCAL_VLLM_API_KEY:?set LOCAL_VLLM_API_KEY}
      - --host
      - 0.0.0.0
      - --port
      - "8000"
    ports:
      - 127.0.0.1:${CHAT_VLLM_PORT:-8001}:8000

  vllm-coder:
    <<: *vllm-service
    image: rocm/vllm:rocm7.13.0_gfx950-dcgpu_ubuntu24.04_py3.13_pytorch_2.10.0_vllm_0.19.1@sha256:3b20f0a32530aefa2416aa30f64011fdcab00c44676a915044b9a17379342fcc
    # The ROCm image carries no entrypoint and its default CMD only pins the
    # matching wheel, so the server is started explicitly; AMD's documented form
    # is `vllm serve ...`.
    entrypoint: ["vllm", "serve"]
    command:
      - --model
      - ${CODER_MODEL_ID:-Qwen/Qwen3-Coder-30B-A3B-Instruct}
      - --revision
      - ${CODER_MODEL_REVISION:-b2cff646eb4bb1d68355c01b18ae02e7cf42d120}
      - --served-model-name
      - local-coder
      - --quantization
      - ${VLLM_QUANTIZATION:-fp8}
      - --max-model-len
      - ${MAX_MODEL_LEN:-8192}
      - --gpu-memory-utilization
      - ${CODER_GPU_MEMORY_UTILIZATION:-0.43}
      - --api-key
      - ${LOCAL_VLLM_API_KEY:?set LOCAL_VLLM_API_KEY}
      - --host
      - 0.0.0.0
      - --port
      - "8000"
    ports:
      - 127.0.0.1:${CODER_VLLM_PORT:-8003}:8000

  router:
    image: ${ROUTER_IMAGE:?set ROUTER_IMAGE to the router runtime image, for example metrum-ai-router:<version>-linux-amd64}
    restart: unless-stopped
    command: ["--config", "/app/config/config.yaml"]
    working_dir: /app/state
    environment:
      ROUTER_ID_TRANSFORM_KEY: ${ROUTER_ID_TRANSFORM_KEY:?set ROUTER_ID_TRANSFORM_KEY to 64 random bytes, hex or base64}
      LOCAL_VLLM_API_KEY: ${LOCAL_VLLM_API_KEY:?set LOCAL_VLLM_API_KEY}
      REFERENCE_ADMIN_PASSWORD_HASH: ${REFERENCE_ADMIN_PASSWORD_HASH:?set REFERENCE_ADMIN_PASSWORD_HASH to a bcrypt hash}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    ports:
      - 127.0.0.1:${ROUTER_HTTP_PORT:-8080}:8080
    volumes:
      # The directory, not the file: the caller-minting step overrides this
      # mount read-write for one run, and a nested file mount would win over it.
      - ./config:/app/config:${ROUTER_CONFIG_MOUNT_MODE:-ro}
      - ./state:/app/state
      - ./logs:/app/logs
    depends_on:
      vllm-tiny:
        condition: service_healthy
      vllm-chat:
        condition: service_healthy
      vllm-coder:
        condition: service_healthy

volumes:
  hf-cache:

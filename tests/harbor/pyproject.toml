[project]
name = "smart-llmrouter-harbor-local"
version = "0.0.0"
description = "Harbor local-task and offline agent-adapter contract tests (issue #94)."
license = "Apache-2.0"
license-files = []
classifiers = ["License :: OSI Approved :: Apache Software License"]
requires-python = ">=3.11"
dependencies = [
  "pytest==9.0.3",
  "PyYAML==6.0.3",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["."]

  - id: ANTH-06
    priority: P1
    owner: api-compat
    component: anthropic-thinking-controls
    source_url: https://github.com/metrum-ai/router/issues/94
    reviewed_date: "2026-10-10"
    inbound_route: /anthropic/v1/messages
    outbound_dialect: anthropic
    capability_profile: reasoning token_budget min 1024 max 4096 budget_must_be_less_than_max_tokens
    transport: unary
    disposition: native_supported
    assertions:
      - omitted thinking is not synthesized; disabled thinking is forwarded verbatim
      - adaptive thinking counts as reasoning and excludes targets without reasoning support
      - manual thinking on a target without reasoning metadata (native or translated) returns 502 no-eligible-target with zero upstream calls
      - caller budget inside the target range is preserved; budgets outside are clamped to target min/max (documented normalization)
      - budget >= max_tokens on a budget_must_be_less_than_max_tokens target rejects before upstream (502 encode_error, zero calls)
      - thinking plus client tools and caller tool_choice are forwarded unchanged
      - adaptive thinking and output_config.effort are provider-owned and forwarded verbatim to native targets (not router-gated)
    evidence_paths:
      - tests/api_compat/tests/test_anthropic_capabilities.py
      - internal/router/reasoning.go
      - internal/router/service.go
    test_id: test_anth_06_thinking_controls_follow_capability_profile

  - id: ANTH-07
    priority: P1
    owner: api-compat
    component: anthropic-fine-grained-tools
    source_url: https://github.com/metrum-ai/router/issues/94
    reviewed_date: "2026-10-10"
    inbound_route: /anthropic/v1/messages
    outbound_dialect: anthropic
    transport: sse
    disposition: native_supported
    assertions:
      - per-tool eager_input_streaming true/false/omitted reaches the native upstream unchanged
      - input_json_delta fragments (escapes, unicode, truncated final JSON) are forwarded byte-exact and in order, never repaired
      - truncated tool input keeps stop_reason max_tokens so the executor can refuse it
      - caller anthropic-beta headers are forwarded only when target allowed_betas permits them (see HTTP-06)
    evidence_paths:
      - tests/api_compat/tests/test_anthropic_capabilities.py
      - internal/router/service.go
    test_id: test_anth_07_eager_input_streaming_fragments_passthrough
    rationale: Fine-grained streaming is transparent native passthrough (provider-owned validation per ARCH-02), not a router capability gate; any model-specific support claim needs live evidence.


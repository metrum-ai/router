    transport: unary
    disposition: native_supported
    assertions:
      - tool_choice omitted/null/auto/none/required/named x parallel_tool_calls omitted/true/false reach upstream verbatim; omitted stays absent
      - requests without tools reach upstream without tools, tool_choice or parallel_tool_calls

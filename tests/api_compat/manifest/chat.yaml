      - required/named choices against a forced_tool_choice-unsupported target return 502 no-eligible-target with zero upstream calls; auto still routes
      - explicit null/auto/none choices against a tool_choice-unsupported target return 502 no-eligible-target with zero upstream calls; omitted still routes
    evidence_paths:

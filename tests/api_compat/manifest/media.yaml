  - id: MEDIA-07
    priority: P1
    owner: api-compat
    component: media
    source_url: https://github.com/metrum-ai/router/issues/94
    reviewed_date: "2026-10-10"
    inbound_route: /v1/chat/completions|/v1/responses|/anthropic/v1/messages
    transport: unary
    disposition: blocked
    assertions:
      - provider file_id and document blocks need explicit supported-route coverage
    rationale: >-
      Blocked on a router product decision (found 2026-10-10). File/document parts are
      handled inconsistently: tool-bearing same-dialect requests forward Chat
      {"type":"file"}, Responses {"type":"input_file"} and Anthropic {"type":"document"}
      blocks raw (with no file/pdf modality check on the target), while text-only
      same-dialect requests, streaming requests and both Chat/Responses bridges re-encode
      through the IR and silently drop those blocks with HTTP 200. The contract
      (preserve only on explicitly supported routes, otherwise reject before upstream) needs
      a decision between rejecting file parts or adding file/pdf eligibility plus
      preservation; neither is a small contained fix. Repro on the session router -
      POST /v1/chat/completions {"model":"chat","messages":[{"role":"user","content":[{"type":"text","text":"hi"},{"type":"file","file":{"file_id":"file-abc"}}]}]}
      returns 200 and the upstream body is {"messages":[{"role":"user","content":"hi"}]}.

  - id: MEDIA-08
    priority: P1
    owner: api-compat
    component: media
    source_url: https://github.com/metrum-ai/router/issues/94
    reviewed_date: "2026-10-10"
    inbound_route: /v1/chat/completions|/v1/responses|/anthropic/v1/messages
    outbound_dialect: openai-chat|openai-responses|anthropic
    capability_profile: vision+cache+usage_db+pii_filter
    transport: mixed
    disposition: native_supported
    assertions:
      - identical deterministic image requests bypass the enabled response cache (two upstream calls) while a text control is served once
      - pii_filter redacts text but leaves image data URLs and URLs byte-identical upstream (apply_to.image_urls off)
      - upstream error, private-URL rejection (image_url_forbidden, zero attempts, zero upstream calls) and streamed Responses/Messages image paths complete
      - image URL, base64 payload, embedded pixel canary, prompt and PII canaries are absent from usage.sqlite, router log, state, stderr and /v1/usage
      - the artifact scanner detects each planted canary (ARCH-08 self-check)
    evidence_paths:
      - tests/api_compat/tests/test_media_matrix.py
      - tests/api_compat/manifest/media.yaml
    test_id: test_media_08_image_canaries_through_cache_pii_error_and_usage
    rationale: Content-capture storage is encrypted and covered by Go tests (redactImages); admin report paths are disabled in this profile.

  - id: MEDIA-09
    priority: P2
    owner: api-compat
    component: media
    source_url: https://github.com/metrum-ai/router/issues/94
    reviewed_date: "2026-09-11"
    inbound_route: /v1/images/generations
    transport: unary
    disposition: unsupported
    assertions:
      - image generation endpoint is not advertised and returns 404 or 405
    evidence_paths:
      - tests/api_compat/tests/test_media_eligibility.py
    test_id: test_media_09_image_generation_unsupported
    rationale: Image input support does not imply image generation APIs.

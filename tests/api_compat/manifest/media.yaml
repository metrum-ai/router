  - id: MEDIA-04
    priority: P1
    owner: api-compat
    component: media
    source_url: https://github.com/metrum-ai/router/issues/94
    reviewed_date: "2026-10-10"
    inbound_route: /v1/chat/completions|/v1/responses|/anthropic/v1/messages
    outbound_dialect: openai-chat|openai-responses|anthropic
    capability_profile: vision
    transport: unary
    disposition: native_supported
    assertions:
      - PNG (landscape, portrait with alpha), JPEG, WebP and transparent GIF fixtures reach the native upstream byte-identical by sha256 with their media type

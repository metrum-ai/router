      - Anthropic base64 image sources keep media_type and bytes (Messages has no detail control)
    evidence_paths:
      - tests/api_compat/tests/test_media_matrix.py
      - tests/api_compat/manifest/media.yaml
    test_id: test_media_04_format_and_detail_matrix
    rationale: Offline router contract only; live OCR fact checks against real vision models remain a live-matrix concern.

